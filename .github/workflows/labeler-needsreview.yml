name: "Лейблы: Ревью"

on:
  pull_request_target:
    types: [review_requested, opened]

jobs:
  add_label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: "Статус: Нужно ревью"
    - uses: actions-ecosystem/action-remove-labels@v1
      with:
        labels: |
          Статус: Ожидает правок
          Status: Awaiting Changes
          S: Awaiting Changes
