name: Конфликты слияния

on:
  push:
    branches: [master, staging, stable]
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  Label:
    if: github.event_name == 'push' || (github.event.pull_request.draft == false && github.actor != 'IanComradeBot')
    runs-on: ubuntu-latest
    steps:
      - name: Check for Merge Conflicts
        uses: eps1lon/actions-label-merge-conflict@v3.1.0
        with:
          dirtyLabel: "Статус: Конфликт слияния"
          repoToken: ${{ github.token }}
          commentOnDirty: "В этом pull request есть конфликты. Разрешите их, прежде чем мы сможем его рассмотреть."
