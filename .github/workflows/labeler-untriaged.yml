name: "Лейблы: Без триажа"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  add_label:
    if: |
      (github.event_name == 'issues' && join(github.event.issue.labels) == '') ||
      (github.event_name == 'pull_request_target' && join(github.event.pull_request.labels) == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
        sparse-checkout: .github/actions/pr-labels
    - uses: ./.github/actions/pr-labels
      with:
        add: |
          Статус: Без триажа
