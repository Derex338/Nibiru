name: "Labels: Size"
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
jobs:
  size-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const sizes = [
              [5000, "размер/XL"],
              [1000, "размер/L"],
              [100, "размер/M"],
              [10, "размер/S"],
              [0, "размер/XS"]
            ];
            const prefixes = ["размер/", "size/"];
            const pullNumber = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100
            });
            const changedLines = files.reduce((total, file) => total + file.changes, 0);
            const sizeLabel = sizes.find(([minimum]) => changedLines >= minimum)[1];
            const currentNames = context.payload.pull_request.labels.map(label => label.name);
            if (!currentNames.includes(sizeLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                labels: [sizeLabel]
              });
            }
            for (const labelName of currentNames) {
              if (labelName !== sizeLabel && prefixes.some(prefix => labelName.startsWith(prefix))) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullNumber,
                  name: labelName
                });
              }
            }
