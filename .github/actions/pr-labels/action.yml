name: Manage PR labels
description: Add and remove issue or pull request labels
inputs:
  add:
    required: false
    default: ""
  remove:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/github-script@v8
      env:
        LABELS_ADD: ${{ inputs.add }}
        LABELS_REMOVE: ${{ inputs.remove }}
      with:
        script: |
          const parse = raw => (raw || "").split(/\r?\n/).map(line => line.trim()).filter(Boolean);
          const issue_number = context.payload.pull_request?.number ?? context.payload.issue?.number;
          const { owner, repo } = context.repo;
          for (const name of parse(process.env.LABELS_ADD)) {
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] });
            } catch (error) {
              core.warning(`Не удалось добавить "${name}": ${error.message}`);
            }
          }
          for (const name of parse(process.env.LABELS_REMOVE)) {
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            } catch (error) {
              core.info(`Не снят "${name}"`);
            }
          }
