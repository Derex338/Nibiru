- type: constructionGraph
  id: BronzeHammerSmall
  start: start
  graph:
    - node: start
      edges:
        - to: assembly
          steps:
            - material: BronzeTopHammerPiece
              amount: 1
            - material: WoodStick
              amount: 1
            - tool: Hammering
              doAfter: 2
    - node: assembly
      entity: BronzeHammerSmallAssembly
      edges:
        - to: fin
          completed:
            - !type:PointsFromCraft
              points: 50
          steps:
            - tool: Hammering
              minTemperature: 700
              doAfter: 5
    - node: fin
