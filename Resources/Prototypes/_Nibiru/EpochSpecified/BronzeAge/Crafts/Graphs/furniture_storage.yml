- type: constructionGraph
  id: Wagon
  start: start
  graph:
    - node: start
      edges:
        - to: frame
          steps:
            - material: WoodenWheel
              amount: 2
            - material: CEWood
              amount: 4
            - tool: Hammering
              doAfter: 10
    - node: frame
      edges:
        - to: fin
          completed:
            - !type:PointsFromCraft
              points: 50
          steps:
            - material: CEWood
              amount: 6
            - tool: Hammering
              doAfter: 15
    - node: fin
      entity: Wagon

