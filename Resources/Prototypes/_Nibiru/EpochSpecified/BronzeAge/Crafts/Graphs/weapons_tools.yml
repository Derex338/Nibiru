- type: constructionGraph
  id: BronzeShield
  start: start
  graph:
    - node: start
      edges:
        - to: frame
          steps:
            - material: WheelBlank
              amount: 1
            - material: WoodPlank
              amount: 2
            - tool: Hammering
              doAfter: 5
    - node: frame
      edges:
        - to: fin
          completed:
            - !type:PointsFromCraft
              points: 50
          steps:
            - material: BronzeInlay
              amount: 1
            - tool: Hammering
              doAfter: 10
    - node: fin
      entity: BronzeShield

