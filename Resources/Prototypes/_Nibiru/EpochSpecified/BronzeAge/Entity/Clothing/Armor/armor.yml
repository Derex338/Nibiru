- type: entity
  parent: [ ClothingOuterBaseLarge, BaseBronzeItem, AllowSuitStorageClothing ]
  id: BronzeChestplate
  suffix: Nibiru, BronzeAge
  name: бронзовый нагрудник
  description: Ляпота.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Clothing/Armor/Chestplate.rsi
  - type: Clothing
    sprite: _Nibiru/EpochSpecified/BronzeAge/Clothing/Armor/Chestplate.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.45
        Slash: 0.45
        Piercing: 0.45
  - type: ArmorProtection
    protection:
      Blunt: 15
      Slash: 20
      Piercing: 18
