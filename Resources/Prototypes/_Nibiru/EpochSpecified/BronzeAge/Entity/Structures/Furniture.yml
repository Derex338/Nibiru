- type: entity
  id: BronzeAgeBed
  suffix: Nibiru, BronzeAge
  parent: Bed
  name: wooden bed
  description: A simple bed made of planks and straw.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Structures/WoodBed.rsi
    state: icon
  - type: Construction
    graph: BronzeAgeBed
    node: fin

- type: entity
  id: BronzeAgeChest
  suffix: Nibiru, BronzeAge
  parent: CrateGeneric
  name: chest
  description: A wooden chest for storing belongings.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Structures/WoodChest.rsi
    layers:
    - state: crate
      map: ["enum.StorageVisualLayers.Base"]
    - state: crate_door
      map: ["enum.StorageVisualLayers.Door"]
  - type: Icon
    sprite: _Nibiru/EpochSpecified/BronzeAge/Structures/WoodChest.rsi
    state: crate_icon
  - type: EntityStorageVisuals
    stateDoorOpen: crate_open
    stateDoorClosed: crate_door
  - type: Construction
    graph: BronzeAgeChest
    node: fin

- type: entity
  id: BronzeBell
  suffix: Nibiru, BronzeAge
  name: bronze bell
  parent: [BaseStructure, BaseBronzeStructure]
  description: A large bronze bell. Its toll carries for many miles.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    noRot: true
    sprite: Structures/Specific/church-bell.rsi
    layers:
    - state: church-bell
      color: "#804000"
  - type: InteractionPopup
    interactDelay: 1
    successChance: 1
    interactSuccessSound:
      collection: ChurchBell
  - type: Clickable
  - type: Rotatable
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Fixtures
  - type: InteractionOutline
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Construction
    graph: BronzeBell
    node: fin
