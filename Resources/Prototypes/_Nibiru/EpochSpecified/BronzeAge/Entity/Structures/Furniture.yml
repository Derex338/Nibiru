- type: entity
  id: BronzeAgeBed
  parent: Bed
  name: деревянная кровать
  description: Простая кровать из досок и соломы.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Structures/WoodBed.rsi
    state: bed
  - type: Construction
    graph: BronzeAgeBed
    node: fin

- type: entity
  id: BronzeAgeChest
  parent: CrateGeneric
  name: сундук
  description: Деревянный сундук для хранения вещей.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Structures/WoodChest.rsi
    layers:
    - state: crate
      map: ["enum.StorageVisualLayers.Base"]
    - state: crate_door
      map: ["enum.StorageVisualLayers.Door"]
  - type: Icon
    sprite: _Nibiru/EpochSpecified/BronzeAge/Structures/WoodChest.rsi
    state: crate_icon
  - type: Construction
    graph: BronzeAgeChest
    node: fin

- type: entity
  id: BronzeBell
  name: бронзовый колокол
  parent: BaseStructure
  description: Большой бронзовый колокол. Его звон разносится на многие мили.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    noRot: true
    sprite: Structures/Specific/church-bell.rsi
    layers:
    - state: church-bell
      color: "#804000"
  - type: InteractionPopup
    interactDelay: 1
    successChance: 1
    interactSuccessSound:
      collection: ChurchBell
  - type: Clickable
  - type: Rotatable
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Fixtures
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Construction
    graph: BronzeBell
    node: fin
