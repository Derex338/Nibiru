- type: entity
  name: бронзовый молоточек
  parent: [BaseItem, BaseBronzeItem]
  id: BronzeHammerSmall
  suffix: Nibiru, BronzeAge
  description: 'Зачарованный силами Богов молоток, способный чинить структуры. Мелким шрифтом выгривировано на бронзе: "1 удар-1 год жизни".'
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Tools/HammerSmall.rsi
    state: icon
  - type: MeleeWeapon
    range: 1.25
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8
        Structural: -5
    soundHit:
      collection: MetalThud
    attackRate: 2
  - type: Item
    size: Large
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Construction
    graph: BronzeHammerSmall
    node: fin
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 2300
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalCrunch
          - !type:SpawnEntitiesBehavior
            spawn:
              BronzeScrap:
                min: 1
                max: 2

