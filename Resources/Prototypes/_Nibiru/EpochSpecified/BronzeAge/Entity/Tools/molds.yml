- type: entity
  parent: [BaseStoneItem, DrinkVisualsFill]
  id: StoneMoldBase
  name: каменная форма
  abstract: true
  description: Форма из обожженного камня для отливки предметов.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Tools/Smelting.rsi
    layers:
      - state: icon
        color: "#808080"
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      metal:
        maxVol: 100
  - type: CoolInWater
    solution: metal
  - type: Temperature
  - type: InjectableSolution
    solution: metal
  - type: RefillableSolution
    solution: metal
  - type: ItemSlots
    slots:
      result_container:
        blacklist:
          components:
          - SolutionContainerManager
          - Item
  - type: ContainerContainer
    containers:
      result_container: !type:ContainerSlot
  - type: DrawableSolution
    solution: metal
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: fill-
  - type: ExaminableSolution
    solution: metal

- type: entity
  parent: StoneMoldBase
  id: StoneMoldIngot
  name: каменная форма для слитка
  description: Каменная форма для отливки металлических слитков.
  components:
  - type: Mold
    resultEntities:
      CopperMolten: IngotCopper1
      TinMolten: IngotTin1
      BronzeMolten: IngotBronze1
    slot: result_container
  - type: SolutionContainerManager
    solutions:
      metal:
        maxVol: 100
  - type: Construction
    graph: MoldIngot
    node: fin

