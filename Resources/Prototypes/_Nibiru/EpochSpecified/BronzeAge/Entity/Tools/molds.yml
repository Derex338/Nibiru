- type: entity
  parent: [BaseStoneItem, DrinkVisualsFill]
  id: StoneMoldBase
  suffix: Nibiru, BronzeAge
  name: каменная форма
  abstract: true
  description: Форма из обожженного камня для отливки предметов.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Tools/Smelting.rsi
    layers:
      - state: base-old
        color: "#808080"
  - type: Item
    size: Large
    shape:
    - 0,0,1,1
  - type: Solution
    id: metal
    solution:
      maxVol: 100
  - type: CoolInWater
    solution: metal
  - type: Temperature
  - type: InjectableSolution
    solution: metal
  - type: RefillableSolution
    solution: metal
  - type: ItemSlots
    slots:
      result_container:
        blacklist:
          components:
          - Solution
          - Item
  - type: ContainerContainer
    containers:
      result_container: !type:ContainerSlot
  - type: DrawableSolution
    solution: metal
  - type: SolutionContainerVisuals
    solutionName: metal
    maxFillLevels: 1
    fillBaseName: fill-
    inHandsFillBaseName: null
  - type: SolutionContainerWhitelist
    reagents:
    - CopperMolten
    - TinMolten
    - BronzeMolten
    - GoldMolten
    - SilverMolten
  - type: ExaminableSolution
    solution: metal
  - type: Mold
    slot: result_container

- type: entity
  parent: StoneMoldBase
  id: StoneMoldIngot
  suffix: Nibiru, BronzeAge
  name: каменная форма для слитка
  description: Каменная форма для отливки металлических слитков.
  components:
  - type: Sprite
    layers:
      - state: base-old
        color: "#808080"
      - state: fill-1
        color: "#2B2B2B"
      - state: fill-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Mold
    resultEntities:
      CopperMolten: IngotCopper1
      TinMolten: IngotTin1
      BronzeMolten: IngotBronze1
      GoldMolten: IngotGold1
      SilverMolten: IngotSilver1
    slot: result_container
  - type: SolutionContainerWhitelist
    reagents:
    - CopperMolten
    - TinMolten
    - BronzeMolten
    - GoldMolten
    - SilverMolten
  - type: Solution
    id: metal
    solution:
      maxVol: 100
  - type: Construction
    graph: MoldIngot
    node: fin

