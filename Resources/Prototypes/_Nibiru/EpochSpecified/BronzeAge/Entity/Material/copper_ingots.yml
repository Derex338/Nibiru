- type: entity
  parent: [IngotBase, BaseCopperItem]
  id: IngotCopper
  name: copper ingot
  suffix: Full, Nibiru, BronzeAge
  components:
  - type: Item
    heldPrefix: copper
    size: Normal
    shape:
    - 0,0,0,0
  - type: SmeltableOre
    meltingPoint: 1085
    meltingSpeed: 1
    resultReagent: CopperMolten
    resultAmount: 100
    resultTemperature: 1200
  - type: Appearance
  - type: Stack
    stackType: Copper
    baseLayer: base
    layerStates:
    - copper
    - copper_2
    - copper_3
  - type: Sprite
    state: copper_3
    layers:
    - state: copper_3
      map: ["base"]

- type: entity
