# ════════════════════════════════════════════════════════════════════════════════
# ███ COIN PURSE ███
# ════════════════════════════════════════════════════════════════════════════════

- type: entity
  parent: ClothingBeltStorageBase
  id: CoinPurse
  suffix: Nibiru, BronzeAge
  name: кошелёк
  description: Кожаный кошелёк для хранения монет. Крепится на пояс.
  components:
  - type: Sprite
    sprite: _CE/Objects/Storage/wallet.rsi
    layers:
      - state: wallet-0
        map: ["enum.StorageFillLayers.Fill"]
  - type: Clothing
    sprite: _CE/Objects/Storage/wallet.rsi
  - type: Item
    size: Small
    shape:
    - 0,0,0,1
  - type: Storage
    grid:
    - 0,0,1,1
    maxItemSize: Tiny
    whitelist:
      tags:
      - Coin
  - type: Construction
    graph: CoinPurse
    node: fin
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 4
    fillBaseName: wallet
