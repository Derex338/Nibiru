- type: entity
  parent: [BaseItem, BaseBronzeItem]
  id: CoinBronze
  suffix: Nibiru, BronzeAge
  name: бронзовая монета
  description: Небольшая монета из бронзы. Ходовая валюта бронзового века.
  components:
  - type: Sprite
    sprite: _CE/Objects/Materials/Currency/coin_cp.rsi
    state: coin10
    layers:
    - state: coin10
      map: ["base"]
  - type: Item
    size: Tiny
    shape:
    - 0,0,0,0
  - type: Stack
    stackType: CoinBronze
    count: 100
    baseLayer: base
    layerStates:
    - coin1
    - coin2
    - coin3
    - coin4
    - coin5
    - coin6
    - coin7
    - coin8
    - coin9
    - coin10
  - type: Tag
    tags:
    - Coin

- type: entity
  id: CoinBronze10
  parent: CoinBronze
  suffix: 10, Nibiru, BronzeAge
  components:
  - type: Stack
    count: 10
  - type: Sprite
    state: coin3

- type: entity
  id: CoinBronze1
  parent: CoinBronze
  suffix: 1, Nibiru, BronzeAge
  components:
  - type: Stack
    count: 1
  - type: Sprite
    state: coin1

