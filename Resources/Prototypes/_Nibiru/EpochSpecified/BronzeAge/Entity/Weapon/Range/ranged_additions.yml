- type: entity
  id: Longbow
  suffix: Nibiru, BronzeAge
  parent: BaseBow
  name: longbow
  description: A large, powerful bow. Requires strength to draw but fires arrows with great force.
  components:
  - type: Clothing
    sprite: _Nibiru/EpochSpecified/StoneAge/Weapon/Range/Bow.rsi
  - type: Item
    sprite: _Nibiru/EpochSpecified/StoneAge/Weapon/Range/Bow.rsi
    size: Huge
    shape:
    - 0,0,0,3
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Range/LongBow.rsi
    layers:
    - state: unwielded
      map: [ base ]
    - state: unwielded-arrow
      sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Range/RecursiveBow.rsi
      map: [ arrow ]
      visible: false
  - type: Appearance
  - type: ItemMapper
    spriteLayers:
    - arrow
    mapLayers:
      arrow:
        whitelist:
          tags:
          - Arrow
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        arrow:
          True: { state: wielded-arrow }
          False: { state: unwielded-arrow }
        base:
          True: { state: wielded }
          False: { state: unwielded }
  - type: Gun
    projectileSpeed: 30
    fireRate: 0.8
  - type: Construction
    graph: Longbow
    node: fin

- type: entity
  id: RecursiveBow
  suffix: Nibiru, BronzeAge
  parent: BaseBow
  name: recurve bow
  description: A bow with limbs that curve away from the archer when unstrung. Stores more energy and delivers a faster shot.
  components:
  - type: Clothing
    sprite: _Nibiru/EpochSpecified/StoneAge/Weapon/Range/Bow.rsi
  - type: Item
    sprite: _Nibiru/EpochSpecified/StoneAge/Weapon/Range/Bow.rsi
    size: Large
    shape:
    - 0,0,0,2
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Range/RecursiveBow.rsi
    layers:
    - state: unwielded
      map: [ base ]
    - state: unwielded-arrow
      map: [ arrow ]
      visible: false
  - type: Appearance
  - type: ItemMapper
    spriteLayers:
    - arrow
    mapLayers:
      arrow:
        whitelist:
          tags:
          - Arrow
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        arrow:
          True: { state: wielded-arrow }
          False: { state: unwielded-arrow }
        base:
          True: { state: wielded }
          False: { state: unwielded }
  - type: Gun
    projectileSpeed: 25
  - type: Construction
    graph: RecursiveBow
    node: fin

- type: entity
  id: ThrowingDart
  suffix: Nibiru, BronzeAge
  name: throwing dart
  parent: [Dart, BaseBronzeItem]
  description: A small, balanced dart designed for throwing.
  components:
  - type: Item
    size: Tiny
    shape:
    - 0,0,0,0
  - type: Sprite
    sprite: Objects/Fun/Darts/dart_red.rsi
    color: "#CD7F32"
    state: icon
  - type: Tag
    tags:
    - Knife
    - Spear
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 10
  - type: ArmorPenetration
    penetration:
      Piercing: 10
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: Construction
    graph: ThrowingDart
    node: fin
  - type: ThrowingAngle
    angle: 315
