
- type: entity
  parent: [BaseArrow, BaseBronzeItem]
  id: BronzeArrow
  suffix: Nibiru, BronzeAge
  name: бронзовая стрела
  description: Когда надо перестрелять птиц. Не забудьте намазать ядом гидры!
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
  - type: Sprite
    #sprite: _Nibiru/Objects/BronzeAge/Weapons/Range/Arrows.rsi
    sprite: Objects/Weapons/Guns/Projectiles/arrows.rsi
    layers:
    - state: tail
      color: white
    - state: rod
      color: brown
    - state: tip
      color: orange
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Projectile
    damage:
      types:
        Piercing: 25
  - type: ArmorPenetration
    penetration:
      Piercing: 14
  - type: Construction
    graph: BronzeArrow
    node: fin

- type: entity
  parent: [BronzeArrow]
  id: BronzeArrowAP
  suffix: Nibiru, BronzeAge
  name: бронебойная бронзовая стрела
  description: Тяжелая стрела с узким наконечником, способная пробить доспехи.
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 15
  - type: ArmorPenetration
    penetration:
      Piercing: 20
  - type: Construction
    graph: BronzeArrowAP
    node: fin
