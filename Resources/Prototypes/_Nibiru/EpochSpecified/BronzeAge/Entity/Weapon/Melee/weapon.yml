- type: entity
  name: бронзовый меч
  parent: [ BaseSword, BaseBronzeItem ]
  id: BronzeSword
  description: Довольно неровный меч из сплава меди и олова. Выглядит древне, даже если является новоскованным.
  components:
  - type: Tag
    tags:
    - Sword
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/BronzeSword.rsi
  - type: MeleeWeapon
    range: 1.50
    attackRate: 1
    damage:
      types:
        Slash: 20
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
  - type: Clothing
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/BronzeSword.rsi
    slots:
    - Back
  - type: DisarmMalus
  - type: Construction
    graph: BronzeSword
    node: fin
  - type: ArmorPenetration
    penetration:
      Slash: 15
      Piercing: 8
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 2500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalCrunch
          - !type:SpawnEntitiesBehavior
            spawn:
              BronzeScrap:
                min: 1
                max: 3


- type: entity
  name: бронзовый топор
  parent: BaseBronzeItem
  id: BronzeAxe
  description: Элитное и тяжёлое оружие настоящего варвара.
  components:
  - type: Tag
    tags:
    - FireAxe
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/BronzeAxe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 0.75
    damage:
      types:
        Slash: 10
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: MeleeRequiresWield
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 15
        Structural: 15
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/BronzeAxe.rsi
    quickEquip: false
    slots:
    - back
  - type: Tool
    qualities:
      - Prying
  - type: ToolTileCompatible
  - type: Prying
  - type: UseDelay
    delay: 1
  - type: StealTarget
    stealGroup: FireAxe
  - type: Construction
    graph: BronzeAxe
    node: fin
  - type: ArmorPenetration
    penetration:
      Blunt: 8
      Slash: 12
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 2500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalCrunch
          - !type:SpawnEntitiesBehavior
            spawn:
              BronzeScrap:
                min: 1
                max: 3

