- type: entity
  name: облегченное бронзовое копьё
  parent: BronzeSpear
  id: LightBronzeSpear
  description: Более легкая версия бронзового копья. Летит дальше, но наносит меньше урона.
  components:
  - type: Tag
    tags:
      - Spear
  - type: Item
    size: Large
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 10
  - type: Projectile
    damage:
      types:
        Piercing: 25
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.30,-0.20
            - -0.20,-0.30
            - 0.30,0.20
            - 0.20,0.30
        density: 12
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Construction
    graph: LightBronzeSpear
    node: fin
  - type: ArmorPenetration
    penetration:
      Piercing: 12

