- type: entity
  name: bronze sword
  parent: [ BaseSword, BaseBronzeItem ]
  id: BronzeSword
  suffix: Nibiru, BronzeAge
  description: A rather uneven sword of copper and tin alloy. Looks ancient even if freshly forged.
  components:
  - type: Tag
    tags:
    - Sword
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/BronzeSword.rsi
  - type: MeleeWeapon
    range: 1.50
    attackRate: 1
    damage:
      types:
        Slash: 15
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: NibiruWeaponAttack
    availableAttacks:
    - Swing
    - Thrust
  - type: Item
    size: Large
    shape:
    - 0,0,0,2
  - type: Clothing
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/BronzeSword.rsi
    slots:
    - Back
  - type: DisarmMalus
  - type: Construction
    graph: BronzeSword
    node: fin
  - type: ArmorPenetration
    penetration:
      Slash: 15
      Piercing: 8
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 2500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalCrunch
          - !type:SpawnEntitiesBehavior
            spawn:
              BronzeScrap:
                min: 1
                max: 3


- type: entity
  name: bronze axe
  parent: BaseBronzeItem
  id: BronzeAxe
  suffix: Nibiru, BronzeAge
  description: An elite, heavy weapon for a true barbarian.
  components:
  - type: Tag
    tags:
    - FireAxe
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/BronzeAxe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 0.75
    damage:
      types:
        Slash: 10
    soundHit:
      collection: MetalThud
  - type: NibiruWeaponAttack
    availableAttacks:
    - Swing
    - Thrust
  - type: Wieldable
  - type: MeleeRequiresWield
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 15
        Structural: 15
  - type: Item
    size: Ginormous
    shape:
    - 0,0,1,0
    - 0,1,0,3
  - type: Clothing
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/BronzeAxe.rsi
    quickEquip: false
    slots:
    - back
  - type: Tool
    qualities:
      - Prying
      - Slicing
  - type: ToolTileCompatible
  - type: Prying
  - type: UseDelay
    delay: 1
  - type: StealTarget
    stealGroup: FireAxe
  - type: Construction
    graph: BronzeAxe
    node: fin
  - type: ArmorPenetration
    penetration:
      Blunt: 8
      Slash: 12
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 2500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalCrunch
          - !type:SpawnEntitiesBehavior
            spawn:
              BronzeScrap:
                min: 1
                max: 3

