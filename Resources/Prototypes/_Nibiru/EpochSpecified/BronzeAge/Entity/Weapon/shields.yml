- type: entity
  name: bronze buckler
  parent: [BaseShield, BaseBronzeItem]
  id: BronzeBuckler
  suffix: Nibiru, BronzeAge
  description: A crude wooden buckler with a bronze alloy rim around the wood and bronze in the center.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/Shields.rsi
    state: bronze-buckler-icon
  - type: Item
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/Shields.rsi
    heldPrefix: bronze-buckler
    size: Large
    shape:
    - 0,0,1,1
  - type: Clothing
    slots: [BACK]
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/Shields.rsi
  - type: NibiruWeaponAttack
    defaultHeldPrefix: bronze-buckler
    availableAttacks:
    - ShieldNormal
    - ShieldGuard
    - ShieldOverhead
  - type: Blocking
    useAttackTypeModes: true
    passiveHandBlockChance: 0.75
    passiveHandBlockCooldown: 1.25
    passiveHandBlockFraction: 0.70
    backBlockFraction: 0.30
    passiveBlockModifier:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.65
        Heat: 3
    passiveHandBlockModifier:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.60
        Heat: 2
      flatReductions:
        Blunt: 1
        Slash: 1
    backBlockModifier:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.90
    activeBlockModifier:
      coefficients:
        Blunt: 0.50
        Slash: 0.50
        Piercing: 0.50
        Heat: 2
      flatReductions:
        Blunt: 1
        Slash: 1
        Piercing: 1
  - type: Construction
    graph: BronzeArmorBuckler
    node: fin
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 5000
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: WoodDestroy
          - !type:SpawnEntitiesBehavior
            spawn:
              MaterialWoodPlank:
                min: 3
                max: 5
              BronzeScrap:
                min: 2
                max: 3

- type: entity
  name: bronze shield
  parent: [BaseShield, BaseBronzeItem]
  id: BronzeShield
  suffix: Nibiru, BronzeAge
  description: Expert workmanship, entirely made of bronze.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/Shields.rsi
    state: bronze-icon
  - type: Item
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/Shields.rsi
    heldPrefix: bronze
    size: Large
    shape:
    - 0,0,1,1
  - type: Clothing
    slots: [BACK]
    sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/Shields.rsi
  - type: NibiruWeaponAttack
    defaultHeldPrefix: bronze
    availableAttacks:
    - ShieldNormal
    - ShieldGuard
    - ShieldOverhead
  - type: Blocking
    useAttackTypeModes: true
    passiveHandBlockChance: 0.70
    passiveHandBlockCooldown: 1.65
    passiveHandBlockFraction: 0.80
    backBlockFraction: 0.40
    passiveBlockModifier:
      coefficients:
        Blunt: 0.45
        Slash: 0.45
        Piercing: 0.45
        Heat: 1.5
    passiveHandBlockModifier:
      coefficients:
        Blunt: 0.40
        Slash: 0.40
        Piercing: 0.45
        Heat: 1.0
      flatReductions:
        Blunt: 1
        Slash: 1
        Piercing: 1
    backBlockModifier:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.80
    activeBlockModifier:
      coefficients:
        Blunt: 0.30
        Slash: 0.30
        Piercing: 0.30
        Heat: 0.85
      flatReductions:
        Blunt: 1
        Slash: 1
        Piercing: 1
  - type: Construction
    graph: BronzeShield
    node: fin
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 7500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalCrunch
          - !type:SpawnEntitiesBehavior
            spawn:
              BronzeScrap:
                min: 3
                max: 6
