# ──────────────────────────────────────────────────────────────────────────────
# BRONZE ASSEMBLIES (Промежуточные заготовки)
# Эти сущности используются как промежуточный этап крафта для горячей ковки.
# ──────────────────────────────────────────────────────────────────────────────

- type: entity
  id: BaseBronzeAssembly
  parent: BaseBronzeItem
  abstract: true
  components:
  - type: Sprite
    color: "#CD7F32" # Bronze color tint
  - type: Item
    size: Large

# --- Tools & Weapons ---

- type: entity
  id: BronzeHammerSmallAssembly
  parent: BaseBronzeAssembly
  name: small bronze hammer assembly
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Tools/HammerSmall.rsi
    state: icon
  - type: Construction
    graph: BronzeHammerSmall
    node: assembly

