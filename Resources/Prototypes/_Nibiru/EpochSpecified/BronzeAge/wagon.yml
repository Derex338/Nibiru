- type: entity
  name: wagon frame
  id: WagonFrame
  parent: BaseStructure
  description: An unfinished wooden wagon frame.
  components:
    - type: Transform
      anchored: false
    - type: Sprite
      sprite: _Nibiru/EpochSpecified/BronzeAge/Structures/Wagon.rsi
      state: wagon
    - type: InteractionOutline
    - type: Construction
      graph: Wagon
      node: frame

- type: entity
  name: wagon
  id: Wagon
  parent: [BaseStructureDynamic, StructureWheeled]
  description: A wooden wagon for transporting goods.
  components:
    - type: Transform
      anchored: false
    - type: Sprite
      sprite: _Nibiru/EpochSpecified/BronzeAge/Structures/Wagon.rsi
      state: wagon
    - type: Rotatable
    - type: InteractionOutline
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.4
          density: 200
          layer:
          - MobLayer
          mask:
          - MobMask
    - type: Damageable
    - type: Injurable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 300
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: WoodDestroy
            - !type:SpawnEntitiesBehavior
              spawn:
                WoodenWheel:
                  min: 2
                  max: 4
                MaterialWoodPlank1:
                  min: 5
                  max: 10
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
    - type: Storage
      maxItemSize: Huge
      grid:
      - 0,0,7,5
    - type: Construction
      graph: Wagon
      node: fin
    - type: CanVehiclePull
