- type: entity
  id: CopperOre
  name: медная руда
  parent: BaseItem
  description: A chunk of copper ore.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Materials/Ore.rsi
    state: icon
  - type: Item
    size: Small
  - type: Stack
    count: 1
    stackType: CopperOre
  - type: SmeltableOre
    meltingPoint: 950
    meltingSpeed: 1
    resultReagent: CopperMolten
    resultAmount: 50
    resultTemperature: 1100
  - type: Tag
    tags:
    - Ore

- type: stack
  id: CopperOre
  name: медная руда
  spawn: CopperOre
  maxCount: 30

- type: entity
  id: WallRockBasaltCopper
  parent: WallRockBasalt
  description: An ore vein rich with copper.
  suffix: Copper
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreCopper
  - type: Sprite
    layers:
    - state: rock_wall
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_wall_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_wall_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_wall_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_wall_west
    - state: rock_gold
      color: "#b87333"
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]
