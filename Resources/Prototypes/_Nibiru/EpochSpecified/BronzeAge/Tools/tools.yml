- type: entity
  name: бронзовый нож
  parent: [BaseKnife, BaseBronzeItem]
  id: BronzeKnife
  description: Красивый боевой нож для ближних конфронтаций.
  components:
  - type: Tag
    tags:
    - CombatKnife
    - Knife
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Tools/Knife.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 12
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 15
  - type: Item
    sprite: _Nibiru/EpochSpecified/BronzeAge/Tools/Knife.rsi
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 225
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          radius: 0.01
          vertices:
          - -0.4,-0.2
          - -0.2,-0.4
          - 0.4,0.2
          - 0.2,0.4
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Construction
    graph: BronzeKnife
    node: fin
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 2500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalCrunch
          - !type:SpawnEntitiesBehavior
            spawn:
              BronzeScrap:
                min: 1
                max: 2
