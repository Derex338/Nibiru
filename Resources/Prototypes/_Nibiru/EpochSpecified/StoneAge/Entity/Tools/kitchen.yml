- type: entity
  parent: BaseWoodItem
  id: WoodenBowl
  suffix: Нибиру, Каменный век
  name: wooden bowl
  description: A rustic bowl carved from wood.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/bowl.rsi
    layers:
    - state: bowl
      color: "#8B4513" # SaddleBrown
    - map: ["enum.SolutionContainerLayers.Fill"]
      state: fill-1
      visible: false
  - type: Item
    sprite: Objects/Consumable/Food/bowl.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
  - type: MixableSolution
    solution: food
  - type: Edible
    edible: Drink
    solution: food
    destroyOnEmpty: false
    utensil: Spoon
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Construction
    graph: WoodenBowl
    node: fin
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodSmash
      - !type:SpawnEntitiesBehavior
        spawn:
          WoodPlank1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

