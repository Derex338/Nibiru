  description: Две деревянные палочки, которые при быстром трении создают искру.
  components:
  - type: Sprite
    sprite: Objects/Materials/parts.rsi
    state: rods_2
  - type: Item
    sprite: Objects/Materials/parts.rsi
    size: Small
    shape:
    - 0,0,1,0
  - type: Construction
    graph: FireStarter
    node: fin
  - type: IgnitionSource
    temperature: 500
    ignited: true
  - type: PhysicalComposition
    materialComposition:
      Wood: 20

