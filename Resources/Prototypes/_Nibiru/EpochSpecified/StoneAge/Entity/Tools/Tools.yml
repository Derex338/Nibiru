
- type: entity
  name: stone hammer
  parent: [BaseItem, BaseStoneItem]
  id: StoneHammer
  suffix: Nibiru, Stone Age
  description: A crude hammer made of a stone tied to a stick. Indispensable in construction.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Tools/Hammer.rsi
    state: icon
  - type: MeleeWeapon
    range: 1.25
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 12
        Structural: 10
    soundHit:
      collection: MetalThud
    attackRate: 1.5
  - type: Construction
    graph: StoneHammer
    node: fin
  - type: ArmorPenetration
    penetration:
      Blunt: 5
  - type: Item
    sprite: _Nibiru/EpochSpecified/StoneAge/Tools/Hammer.rsi
    size: Large
    shape:
    - 0,0,2,0
    - 1,1,1,2
  - type: Tool
    qualities:
      - Hammering
      - CEHammering
    useSound:
      path: /Audio/Items/wirecutter.ogg
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalCrunch
          - !type:SpawnEntitiesBehavior
            spawn:
              Stone1:
                min: 1
                max: 1

- type: entity
