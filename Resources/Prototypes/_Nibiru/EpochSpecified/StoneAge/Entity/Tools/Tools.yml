
- type: entity
  name: каменный молоток
  parent: [BaseItem, BaseStoneItem]
  id: StoneHammer
  suffix: Нибиру, Каменный век
  description: Грубый молоток, сделанный из камня, привязанного к палке. Незаменим в строительстве.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Tools/Hammer.rsi
    state: icon
  - type: MeleeWeapon
    range: 1.25
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 12
        Structural: 10
    soundHit:
      collection: MetalThud
    attackRate: 1.5
  - type: Construction
    graph: StoneHammer
    node: fin
  - type: ArmorPenetration
    penetration:
      Blunt: 5
  - type: Item
    sprite: _Nibiru/EpochSpecified/StoneAge/Tools/Hammer.rsi
    size: Large
    shape:
    - 0,0,2,0
    - 1,1,1,2
  - type: Tool
    qualities:
      - Hammering
      - CEHammering
    useSound:
      path: /Audio/Items/wirecutter.ogg
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalCrunch
          - !type:SpawnEntitiesBehavior
            spawn:
              Stone:
                min: 1
                max: 1

- type: entity
  name: каменный топор
  parent: [BaseItem, BaseStoneItem]
  id: StoneHatchet
  suffix: Нибиру, Каменный век
  description: Простой топор с каменным лезвием. Полезен для рубки деревьев и голов.
  components:
  - type: Tag
    tags:
    - BotanyHatchet
  - type: Tool
    qualities:
    - Slicing
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Tools/Axe.rsi
    state: icon
  - type: MeleeWeapon
    range: 0.75
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 1.25
    damage:
      types:
        Slash: 15
        Blunt: 5
        Structural: 5
  - type: Construction
    graph: StoneHatchet
    node: fin
  - type: ArmorPenetration
    penetration:
      Slash: 4
      Blunt: 3
  - type: Item
    sprite: _Nibiru/EpochSpecified/StoneAge/Tools/Axe.rsi
    size: Normal
    shape:
    - 0,0,0,1
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:SpawnEntitiesBehavior
            spawn:
              SharpStone:
                min: 1
                max: 1

- type: entity
