- type: entity
  name: fire starter
  parent: BaseItem
  id: FireStarter
  suffix: Nibiru, Stone Age
  description: Two wooden sticks that create a spark when rubbed together quickly.
  components:
  - type: Sprite
    sprite: Objects/Materials/parts.rsi
    state: rods_2
  - type: Item
    sprite: Objects/Materials/parts.rsi
    size: Small
    shape:
    - 0,0,1,0
  - type: Construction
    graph: FireStarter
    node: fin
  - type: IgnitionSource
    temperature: 500
    ignited: true
  - type: PhysicalComposition
    materialComposition:
      Wood: 20

