- type: entity
  name: костяная игла
  parent: BaseItem
  id: BoneNeedle
  description: Острая игла из кости. Используется для шитья.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Tools/Needle.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Melee/needle.rsi
  - type: Tool
    qualities:
      - Sewing
    useSound:
      path: /Audio/Items/wirecutter.ogg
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 5
  - type: ThrowingAngle
    angle: 225
  - type: ArmorPenetration
    penetration:
      Piercing: 1
  - type: PhysicalComposition
    materialComposition:
      Bone: 1

- type: entity
  name: приспособление для разжигания огня
  parent: BaseItem
  id: FireStarter
  description: Две деревянные палочки, которые при быстром трении создают искру.
  components:
  - type: Sprite
    sprite: Objects/Materials/parts.rsi
    state: rods_2
  - type: Item
    sprite: Objects/Materials/parts.rsi
  - type: IgnitionSource
    temperature: 500
    ignited: true
  - type: PhysicalComposition
    materialComposition:
      Wood: 20

