- type: entity
  parent: [ ClothingOuterBaseLarge, BaseBronzeItem, AllowSuitStorageClothing ]
  id: WoodChestplate
  name: деревянный нагрудник
  description: Грубая защита из досок.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Clothing/Armor/WoodArmor.rsi
  - type: Clothing
    sprite: _Nibiru/EpochSpecified/StoneAge/Clothing/Armor/WoodArmor.rsi
  - type: Construction
    graph: WoodChestplate
    node: fin
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.85
        Piercing: 0.95
  - type: ArmorProtection
    protection:
      Blunt: 4
      Slash: 5
      Piercing: 3
  - type: GroupExamine
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET

