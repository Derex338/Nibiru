- type: entity
  parent: [ ClothingOuterBaseLarge, BaseWoodItem, AllowSuitStorageClothing ]
  id: WoodChestplate
  suffix: Nibiru, Stone Age
  name: wooden chestplate
  description: Crude protection made of planks.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Clothing/Armor/WoodArmor.rsi
  - type: Clothing
    sprite: _Nibiru/EpochSpecified/StoneAge/Clothing/Armor/WoodArmor.rsi
  - type: Item
    size: Large
    shape:
    - 0,0,1,1
  - type: Construction
    graph: WoodChestplate
    node: fin
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.85
        Piercing: 0.95
  - type: ArmorProtection
    protection:
      Blunt: 4
      Slash: 5
      Piercing: 3
  - type: GroupExamine
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET

