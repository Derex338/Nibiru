- type: entity
  id: ResearchTable
  suffix: Nibiru, Stone Age
  parent: BaseWoodStructure
  name: research table
  description: This is where the magic of progress happens.
  components:
  - type: Sprite
    sprite: _CE/Structures/Furniture/Tables/workbench.rsi
    state: research_table
  - type: ResearchClient
  - type: ResearchConsole
  - type: TechnologyDatabase
    supportedDisciplines:
    - StoneAge
    - BronzeAge
  - type: ActivatableUI
    key: enum.ResearchConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ResearchConsoleUiKey.Key:
        type: ResearchConsoleBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: Construction
    graph: ResearchTable
    node: fin

- type: entity
  id: ResearchTableDebug
  parent: ResearchTable
  name: research table
  suffix: Debug
  description: This is where the magic of progress happens.
  components:
  - type: DebugUnlockAllTechnologies
