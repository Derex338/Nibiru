- type: entity
  id: SmeltingFurnace
  suffix: Nibiru, Stone Age
  parent: BaseStoneStructure
  name: bloomery furnace
  description: A simple stone furnace requiring no additional effort for smelting basic ores such as copper and tin.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Structures/furnace.rsi
    layers:
    - map:
      - enum.FuelLightVisualLayers.Base
      state: icon
    - map:
      - enum.FuelLightVisualLayers.Glow
      state: lit
      color: "#FFFFFF"
      visible: false
      #shader: unshaded
  - type: Appearance
  - type: Transform
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: SmeltingFurnace
    containerId: ore_container
    solutionContainerId: solution_container
    maxOreCapacity: 10
    solution: smelted_metal
  #- type: SolutionContainerManager
  #  solutions:
  #    smelted_metal:
  #      maxVol: 100
  #      canReact: true
  - type: Solution
    id: smelted_metal
    solution:
      maxVol: 100
  - type: DrainableSolution
    solution: smelted_metal
  - type: PointLight
    enabled: false
    color: "#E25822"
    radius: 0.5
    energy: 2.0
    netsync: false
  - type: FuelConsumption
    maxFuelAmount: 1800 # 30 минут работы
    targetBurnTemperature: 1400 # Высокая температура для плавки
    minOperatingTemperature: 800 # Работает при 800°C+
    heatingRate: 40 # Медленно нагревается
    coolingRate: 15 # Очень медленно остывает
    fuelConsumptionRate: 0.5 # Экономный расход
    fadeOutDuration: 30
    turnOnBehaviourID: turn_on
    extinguisherQuality: Digging
    fadeOutBehaviourID: fade_out
    iconStateSpent: icon
    litSound:
      path: /Audio/Items/Flare/flare_on.ogg
    loopedSound:
      path: /Audio/Items/Flare/flare_burn.ogg
  - type: Clickable
  - type: InteractionOutline
  - type: LightBehaviour
    behaviours:
    # immediately make it bright and flickery
    - !type:RandomizeBehaviour
      id: turn_on
      interpolate: Nearest
      minDuration: 0.02
      maxDuration: 0.06
      startValue: 2.0
      endValue: 4.0
      property: Energy
      isLooped: true
    # have the radius start small and get larger as it starts to burn
    - !type:FadeBehaviour
      id: turn_on
      maxDuration: 8.0
      startValue: 1.0
      endValue: 2.0
    # weaker flicker as it fades out
    - !type:RandomizeBehaviour
      id: fade_out
      interpolate: Nearest
      minDuration: 0.02
      maxDuration: 0.06
      startValue: 4.0
      endValue: 8.0
      property: Energy
      isLooped: true
    # fade out radius as it burns out
    - !type:FadeBehaviour
      id: fade_out
      maxDuration: 4.0
      startValue: 2.0
      endValue: 1.0
  - type: ItemSlots
    slots:
      solution_container:
        whitelist:
          components:
          - FitsInDispenser
  - type: ContainerContainer
    containers:
      solution_container: !type:ContainerSlot
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand
  - type: Temperature
  - type: Construction
    graph: Furnace
    node: fin

- type: entity
  id: Fuel
  suffix: Nibiru, Stone Age
  name: fuel
  description: A chunk of copper ore.
  components:
  - type: Sprite
    sprite: Objects/Materials/ore.rsi
    state: coal
  - type: Item
    size: Small
  - type: Fuel
  - type: Clickable
  - type: InteractionOutline
  - type: Temperature
  - type: TemperatureColor

- type: entity
  id: ScrapMetal
  suffix: Nibiru, Stone Age
  name: ScrapMetal
  description: A chunk of fucked up ore.
  components:
  - type: Sprite
    sprite: Objects/Materials/ore.rsi
    state: coal
  - type: Item
    size: Small
  - type: Clickable
  - type: InteractionOutline

- type: entity
  id: FurnaceBeaker
  suffix: Nibiru, Stone Age
  parent: LargeBeaker
  name: crucible
  description: A stone crucible for smelting ore into molten metal.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Tools/Smelting.rsi
    layers:
      - state: beaker
      - state: fill-1
        sprite: _Nibiru/EpochSpecified/BronzeAge/Tools/Smelting.rsi
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  #- type: SolutionContainerManager
  #  solutions:
  #    smelted_metal:
  #      maxVol: 100
  - type: InjectableSolution
    solution: smelted_metal
  - type: RefillableSolution
    solution: smelted_metal
  - type: DrainableSolution
    solution: smelted_metal
  - type: ExaminableSolution
    solution: smelted_metal
  - type: Construction
    graph: StoneCrucible
    node: fin
  - type: DrawableSolution
    solution: smelted_metal
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: SolutionItemStatus
    solution: smelted_metal
  - type: Solution
    id: smelted_metal
    solution:
      maxVol: 100
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Spillable
    solution: smelted_metal
  - type: CoolInWater
    solution: smelted_metal
  - type: Temperature
  - type: FitsInDispenser
    solution: smelted_metal
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    inHandsMaxFillLevels: 0
    inHandsFillBaseName: null
    fillBaseName: fill-
  - type: AtmosExposed
