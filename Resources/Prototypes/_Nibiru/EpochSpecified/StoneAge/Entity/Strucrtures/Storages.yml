- type: entity
  id: Barrel
  parent: StorageTank
  name: бочка
  description: Деревянная бочка готовая к наполнению житкостями.
  suffix: Empty, Нибиру, Каменный век
  components:
  - type: StaticPrice
    price: 500
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Structures/Barrel.rsi
    layers:
      - state: base
        map: ["enum.StorageVisualLayers.Base"]
      - state: fill-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
      - state: closed
        map: ["enum.OpenableVisuals.Layer"]
  - type: Appearance
  - type: Openable
    closeable: true
    sound: /Audio/Effects/woodenclosetopen.ogg
    closeSound: /Audio/Effects/woodenclosetclose.ogg
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "open"}
          False: {state: "closed"}
  - type: SolutionContainerVisuals
    solutionName: tank
    maxFillLevels: 5
    fillBaseName: fill-
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: Construction
    graph: Barrel
    node: fin
  - type: Transform
    noRot: true
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 500
        mask:
        - SmallMobMask #this is so they can go under plastic flaps
        layer:
        - MachineLayer
