- type: entity
  parent: BaseStoneItem
  id: StoneBlock
  name: каменный блок
  description: Грубо отесанный каменный блок.
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Material/StoneBlock.rsi
    state: icon
  - type: Item
    sprite: _Nibiru/EpochSpecified/StoneAge/Material/StoneBlock.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SharpStone:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Damageable
    damageModifierSet: Stone
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      StoneBlock: 100
  - type: Stack
    stackType: StoneBlock
    count: 5
    baseLayer: base

- type: entity
  parent: StoneBlock
  id: StoneBlock1
  suffix: Single
  components:
  - type: Stack
    count: 1

