- type: entity
  parent: BaseStoneItem
  id: Stone
  name: stone
  suffix: Nibiru, Stone Age
  abstract: true
  description: just a stone
  components:
  - type: Tag
    tags:
    - Stone
  - type: Sprite
    sprite: _CE/Objects/Materials/stone.rsi
    state: stone
    layers:
    - state: stone
      map:
      - "base"
  - type: Item
    sprite: _Nibiru/EpochSpecified/StoneAge/Material/Stone.rsi
    shape:
    - 0,0,1,1
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SharpStone:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts:
        - "Destruction"
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Damageable
    damageModifierSet: Stone
  - type: Injurable
    damageContainer: Inorganic
  - type: Material
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
    angle: 0
    attackRate: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 3
  - type: ArmorPenetration
    penetration:
      Blunt: 2
  - type: Appearance
  - type: Stack
    stackType: Stone
    count: 10
    baseLayer: base
    layerStates:
    - stone
    - stone_2
    - stone_3
  - type: Projectile
    onlyCollideWhenShot: true
    damage:
      types:
        Blunt: 15
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.25
        density: 40
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Physics
    bodyType: Dynamic
  - type: CollisionWake
  - type: ToolRefinable
    qualityNeeded: Hammering
    refineTime: 2
    refineResult:
    - id: SharpStone
      amount: 1
  - type: Tool
    qualities:
    - Hammering

- type: entity
  parent: Stone
  id: Stone1
  name: stone
  suffix: Single, Nibiru, Stone Age
  components:
  - type: Stack
    count: 1

- type: entity
  parent: BaseStoneItem
  id: SharpStone
  suffix: Nibiru, Stone Age
  name: sharp stone
  description: just a sharp stone
  components:
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Material/Stone.rsi
    state: icon
  - type: Item
    sprite: _Nibiru/EpochSpecified/StoneAge/Material/Stone.rsi
    shape:
    - 0,0,0,0
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
    angle: 0
    attackRate: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 5
  - type: ArmorPenetration
    penetration:
      Slash: 3
  - type: Tool
    qualities:
      - Slicing
    useSound:
      path: /Audio/Items/wirecutter.ogg
    speedModifier: 0.5
  - type: Material
  - type: Stack
    stackType: SharpStone
    count: 5
    baseLayer: base

- type: entity
  parent: SharpStone
  id: SharpStone1
  name: sharp stone
  suffix: Single, Nibiru, Stone Age
  components:
  - type: Stack
    count: 1

- type: damageModifierSet
  id: Stone
  coefficients:
    Slash: 10
    Blunt: 0.01
