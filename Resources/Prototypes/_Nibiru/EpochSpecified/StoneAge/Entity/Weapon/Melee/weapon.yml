- type: entity
  name: bone knife
  parent: BaseKnife
  id: BoneKnife
  suffix: Nibiru, Stone Age
  description: A sharpened bone with a handle. It was made for killing and is meant to kill.
  components:
  - type: Tag
    tags:
    - CombatKnife
    - Knife
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Weapon/BoneKnife.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.2
    damage:
      types:
        Slash: 10
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10
  - type: Item
    sprite: _Nibiru/EpochSpecified/StoneAge/Weapon/BoneKnife.rsi
    size: Normal
    shape:
    - 0,0,0,0
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 225
  - type: Construction
    graph: BoneKnife
    node: fin
  - type: ArmorPenetration
    penetration:
      Slash: 4
      Piercing: 2

