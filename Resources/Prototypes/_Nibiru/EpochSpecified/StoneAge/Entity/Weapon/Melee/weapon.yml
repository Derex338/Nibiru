- type: entity
  name: нож из кости
  parent: BaseKnife
  id: BoneKnife
  description: Заточенная кость с рукояткой. Он был создан убийствои и предназначен убивать.
  components:
  - type: Tag
    tags:
    - CombatKnife
    - Knife
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Weapon/BoneKnife.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.2
    damage:
      types:
        Slash: 10
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 15
  - type: Item
    sprite: _Nibiru/EpochSpecified/StoneAge/Weapon/BoneKnife.rsi
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 225
  - type: ArmorPenetration
    penetration:
      Slash: 4
      Piercing: 2

