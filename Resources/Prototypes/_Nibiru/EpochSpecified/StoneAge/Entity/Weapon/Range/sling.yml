- type: entity
  id: Sling
  suffix: Nibiru, Stone Age
  parent: BaseBow
  name: sling
  description: A simple throwing weapon for slinging stones.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Bow/bow.rsi
    color: "#A0522D"
    layers:
    - state: unwielded
      map: [ base ]
    - state: unwielded-arrow
      map: [ arrow ]
      visible: false
  - type: Item
    size: Normal
    shape:
    - 0,0,0,1
  - type: ItemMapper
    spriteLayers:
    - arrow
    mapLayers:
      arrow:
        whitelist:
          tags:
          - Stone
  - type: Gun
    minAngle: 0
    maxAngle: 10
    fireRate: 0.75
    projectileSpeed: 20
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: ItemSlots
    slots:
      projectiles:
        name: Projectiles
        startingItem: null
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
        whitelist:
          tags:
          - Stone
  - type: ContainerContainer
    containers:
      projectiles: !type:ContainerSlot
  - type: Construction
    graph: Sling
    node: fin

- type: entity
  id: SpearThrower
  suffix: Nibiru, Stone Age
  parent: BaseBow
  name: spear thrower
  description: A simple device using leverage to achieve greater velocity in dart-throwing or spear-throwing.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Bow/bow.rsi
    color: "#A0522D"
    layers:
    - state: unwielded
      map: [ base ]
    - state: unwielded-arrow
      map: [ arrow ]
      visible: false
  - type: Item
    size: Large
    shape:
    - 0,0,0,2
  - type: ItemMapper
    spriteLayers:
    - arrow
    mapLayers:
      arrow:
        whitelist:
          tags:
          - Spear
  - type: Gun
    minAngle: 0
    maxAngle: 5
    fireRate: 0.5
    projectileSpeed: 30
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: ItemSlots
    slots:
      projectiles:
        name: Projectiles
        startingItem: null
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
        whitelist:
          tags:
          - Spear
  - type: ContainerContainer
    containers:
      projectiles: !type:ContainerSlot
  - type: Construction
    graph: SpearThrower
    node: fin
