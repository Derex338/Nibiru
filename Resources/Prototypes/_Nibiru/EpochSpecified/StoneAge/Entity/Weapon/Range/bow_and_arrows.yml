# ════════════════════════════════════════════════════════════════════════════════
# Stone Age Ranged Weapons - Bow and Arrows
# ════════════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────────────
# Wooden Bow (Деревянный лук)
# ──────────────────────────────────────────────────────────────────────────────
- type: entity
  id: WoodenBow
  suffix: Nibiru, Stone Age
  parent: BaseBow
  name: wooden bow
  description: A simple bow made from a flexible branch and plant fiber string.
  components:
  - type: Item
    size: Large
    shape:
    - 0,0,0,2
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/StoneAge/Weapon/Range/Bow.rsi
    layers:
    - state: unwielded
      map: [ base ]
    - state: unwielded-arrow
      map: [ arrow ]
      visible: false
  - type: ItemSlots
    slots:
      projectiles:
        name: Projectiles
        startingItem: null
        insertSound:
          path: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
        whitelist:
          tags:
          - Arrow
  - type: Appearance
  - type: ItemMapper
    spriteLayers:
    - arrow
    mapLayers:
      arrow:
        whitelist:
          tags:
          - Arrow
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        arrow:
          True: { state: wielded-arrow }
          False: { state: unwielded-arrow }
        base:
          True: { state: wielded }
          False: { state: unwielded }
  - type: Construction
    graph: WoodenBow
    node: fin

# ──────────────────────────────────────────────────────────────────────────────
# Wooden Arrow (Деревянная стрела)
# ──────────────────────────────────────────────────────────────────────────────
- type: entity
  parent: BaseArrow
  id: ArrowWood
  suffix: Nibiru, Stone Age
  name: wooden arrow
  description: A simple arrow with a sharpened wooden tip. Not very effective, but easy to make.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/arrows.rsi
    layers:
    - state: tail
      color: "#8B4513"
    - state: rod
      color: "#D2B48C"
    - state: tip
      color: "#8B451300" # Transparent tip
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - sprite: _Nibiru/Effects/lobbed_indicator.rsi
      state: ground
      visible: false
      map: ["enum.NibiruLobbedArrowVisuals.Grounded"]
  - type: Projectile
    damage:
      types:
        Piercing: 15
  - type: ArmorPenetration
    penetration:
      Piercing: 2
  - type: Construction
    graph: WoodenArrow
    node: fin
  - type: ThrowingAngle
    angle: 0

# ──────────────────────────────────────────────────────────────────────────────
# Stone Arrow (Каменная стрела)
# ──────────────────────────────────────────────────────────────────────────────
- type: entity
  parent: BaseArrow
  id: ArrowStone
  suffix: Nibiru, Stone Age
  name: stone-tipped arrow
  description: An arrow with a sharpened stone tip, bound with plant fiber. More deadly than wooden arrows.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/arrows.rsi
    layers:
    - state: tail
      color: "#8B4513"
    - state: rod
      color: "#D2B48C"
    - state: tip
      color: "#696969"
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - sprite: _Nibiru/Effects/lobbed_indicator.rsi
      state: ground
      visible: false
      map: ["enum.NibiruLobbedArrowVisuals.Grounded"]
  - type: Projectile
    damage:
      types:
        Piercing: 28
  - type: ArmorPenetration
    penetration:
      Piercing: 6
  - type: Construction
    graph: StoneArrow
    node: fin
  - type: ThrowingAngle
    angle: 0

# ──────────────────────────────────────────────────────────────────────────────
# Leather Quiver (Кожаный колчан)
# ──────────────────────────────────────────────────────────────────────────────
- type: entity
  parent: ClothingBeltQuiver
  id: QuiverLeather
  suffix: Nibiru, Stone Age
  name: leather quiver
  description: A simple leather quiver for holding arrows.
  components:
  - type: Item
    size: Large
    shape:
    - 0,0,1,1
  - type: Construction
    graph: QuiverLeather
    node: fin
