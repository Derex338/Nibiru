# ──────────────────────────────────────────────────────────────────────────────
# Herbal Belt (Травяной пояс)
# Требует: Трава + Верёвка травяная + Шитьё
# Базовый пояс для хранения
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: HerbalBelt
  start: start
  graph:
    - node: start
      edges:
        - to: fin
          completed:
            - !type:PointsFromCraft
              points: 10
          steps:
            - material: Herb
              amount: 3
            - material: HerbRope
              amount: 1
    - node: fin
      entity: ClothingUniformHerbalBelt

# ──────────────────────────────────────────────────────────────────────────────
# Tunic (Туника)
# Требует: Ткань + Верёвка + Шитьё
# Базовая одежда
