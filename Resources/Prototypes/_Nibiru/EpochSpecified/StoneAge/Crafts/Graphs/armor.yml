# ════════════════════════════════════════════════════════════════════════════════
# ███ SECTION 7: ARMOR ███
# Protective equipment
# ════════════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────────────
# Wood Chestplate (Деревянный нагрудник)
# Требует: Доски + Верёвка + Забивание
# Базовая броня
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: WoodChestplate
  start: start
  graph:
    - node: start
      edges:
        - to: fin
          completed:
            - !type:PointsFromCraft
              points: 30
          steps:
            - material: CEWood
              amount: 5
            - material: HerbRope
              amount: 2

    - node: fin
      entity: WoodChestplate

# ──────────────────────────────────────────────────────────────────────────────
# Leather Helmet (Кожаный шлем)
# Требует: Кожа + Шитьё
# Кожаная защита головы
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: LetherHelmet
  start: start
  graph:
    - node: start
      edges:
        - to: intermediate
          steps:
            - material: Leather
              amount: 5
            - material: Thread
              amount: 2
    - node: intermediate
      entity: LetherHelmetIntermediate
      edges:
        - to: fin
          completed:
            - !type:PointsFromCraft
              points: 20
          steps:
            - tool: Sewing
              doAfter: 5
    - node: fin
      entity: LetherHelmet
      edges:
        - to: reinforced
          steps:
            - material: CEBone
              amount: 5
            - tool: Sewing
              doAfter: 10
    - node: reinforced
      entity: LetherHelmetReinforced

# ──────────────────────────────────────────────────────────────────────────────
