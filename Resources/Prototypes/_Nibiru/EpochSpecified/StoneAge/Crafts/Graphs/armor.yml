# ──────────────────────────────────────────────────────────────────────────────
# Leather Chestplate (Кожаный нагрудник)
# Требует: Кожа + Нить + Шитьё
# Кожаная защита тела
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: LetherChestplate
  start: start
  graph:
    - node: start
      edges:
        - to: intermediate
          steps:
            - material: Leather
              amount: 10
            - material: Thread
              amount: 3
    - node: intermediate
      entity: LetherChestplateIntermediate
      edges:
        - to: fin
          completed:
            - !type:PointsFromCraft
              points: 30
          steps:
            - tool: Sewing
              doAfter: 6
    - node: fin
      entity: LetherChestplate
      edges:
        - to: reinforced
          steps:
            - material: CEBone
              amount: 10
            - tool: Sewing
              doAfter: 15
    - node: reinforced
      entity: LetherChestplateReinforced

