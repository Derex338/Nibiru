# ──────────────────────────────────────────────────────────────────────────────
# Stone Anvil Workbench (Каменная наковальня)
# Требует: Каменные блоки + Грязь (как связующее) + Забивание
# Для создания каменных инструментов и оружия
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: StoneAnvilWorkbench
  start: start
  graph:
    - node: start
      edges:
        - to: frame
          steps:
            - material: StoneBlock
              amount: 3
              doAfter: 3
    - node: frame
      entity: StoneAnvilWorkbenchFrame
      edges:
        - to: fin
          completed:
            - !type:AddFactionComponent
            - !type:PointsFromCraft
              points: 100
          steps:
            - material: CEDirt
              amount: 3
            - tool: Hammering
              doAfter: 5
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: StoneBlock1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 8
    - node: fin
      entity: StoneAnvilWorkbench
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: StoneBlock1
              amount: 3
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 12

# ──────────────────────────────────────────────────────────────────────────────
# Stone Anvil from Boulder (Наковальня из валуна)
# Альтернативный способ: вырезать наковальню из валуна (FloraRockSolid)
# Требует: Инструмент забивания (долгий процесс обтёсывания)
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: StoneAnvilFromBoulder
  start: boulder
  graph:
    - node: boulder
      entity: FloraRockSolid
      edges:
        # Обтесать валун в грубую форму
        - to: roughShape
          steps:
            - tool: Hammering
              doAfter: 15
    - node: roughShape
      entity: StoneAnvilWorkbenchFrame
      edges:
        # Завершить обработку
        - to: fin
          completed:
            - !type:AddFactionComponent
            - !type:PointsFromCraft
              points: 100
          steps:
            - tool: Hammering
              doAfter: 10
        # Разобрать обратно в камни
        - to: destroy
          completed:
            - !type:SpawnPrototype
              prototype: CEStone
              amount: 5
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 8
    - node: fin
      entity: StoneAnvilWorkbench
      edges:
        - to: destroy
          completed:
            - !type:SpawnPrototype
              prototype: CEStone
              amount: 8
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 15
    - node: destroy
