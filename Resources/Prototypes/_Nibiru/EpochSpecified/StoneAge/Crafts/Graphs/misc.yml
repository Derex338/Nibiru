# ──────────────────────────────────────────────────────────────────────────────
# Clay Kitchenware (Глиняная посуда)
# ──────────────────────────────────────────────────────────────────────────────

- type: constructionGraph
  id: ClayBowl
  start: start
  graph:
    - node: start
      edges:
        - to: raw
          completed:
            - !type:PointsFromCraft
              points: 10
          steps:
            - material: CEDirt
              amount: 1
              doAfter: 3
    - node: raw
      entity: ClayBowlRaw
      edges:
        - to: fin
          steps:
            - minTemperature: 500
    - node: fin
      entity: ClayBowl

