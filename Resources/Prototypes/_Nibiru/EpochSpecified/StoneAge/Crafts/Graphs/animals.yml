- type: constructionGraph
  id: Dog
  start: start
  graph:
  - edges:
    - steps:
      - !type:MaterialConstructionGraphStep
        material: MediumHide
      to: fin
      completed:
      - !type:PointsFromCraft
        points: 10
    node: start
  - node: fin
    entity: !type:StaticNodeEntity
      id: MobNibiruDog

