# ──────────────────────────────────────────────────────────────────────────────
# Wooden Spear (Деревянное копьё)
# Требует: Палки + Инструмент резки (заточка)
# Базовое оружие ближнего боя
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: WoodenSpear
  start: start
  graph:
    - node: start
      edges:
        - to: fin
          completed:
            - !type:PointsFromCraft
              points: 5
          steps:
            - material: WoodStick
              amount: 2
            - tool: Slicing
              doAfter: 4
    - node: fin
      entity: WoodSpear

# ──────────────────────────────────────────────────────────────────────────────
# Stone Spear (Каменное копьё)
# Требует: Палки + Острый камень + Верёвка (для крепления)
# Улучшенное оружие ближнего боя
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: StoneSpear
  start: start
  graph:
    - node: start
      edges:
        - to: fin
          completed:
            - !type:PointsFromCraft
              points: 5
          steps:
            - material: WoodStick
              amount: 2
            - material: SharpStone
              amount: 1
            - material: HerbRope
              amount: 1
              doAfter: 5
        - to: fin
          completed:
            - !type:PointsFromCraft
              points: 5
          steps:
            - material: WoodStick
              amount: 2
            - material: SharpStone
              amount: 1
            - material: Vein_processed
              amount: 1
              doAfter: 5
    - node: fin
      entity: StoneSpear

