# ──────────────────────────────────────────────────────────────────────────────
# Ground Soil (Грядка земли)
# Требует: Инструмент копания (лопата)
# Результат: Грядка + побочный материал (грязь)
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: GroundSoil
  start: start
  graph:
    - node: start
      edges:
        - to: fin
          completed:
            - !type:SpawnPrototype
              prototype: Mud1
              amount: 3
            - !type:PointsFromCraft
              points: 1488
          steps:
            - tool: Diging
              doAfter: 10
    - node: fin
      entity: soilPlate
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: Mud1
              amount: 2
          steps:
            - tool: Diging
              doAfter: 10

# ──────────────────────────────────────────────────────────────────────────────
# Grow Tree (Посадка дерева)
# Требует: Жёлудь
# Результат: Растущее дерево
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: GrowTree
  start: start
  graph:
    - node: start
      edges:
        - to: fin
          steps:
            - material: acorn
              amount: 1
            - tool: Diging
              doAfter: 2
    - node: fin
      entity: GrowTreeFirst

