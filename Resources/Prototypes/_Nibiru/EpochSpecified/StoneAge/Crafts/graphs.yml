# ──────────────────────────────────────────────────────────────────────────────
# Stone Anvil from Boulder (Наковальня из валуна)
# Альтернативный способ: вырезать наковальню из валуна (FloraRockSolid)
# Требует: Инструмент забивания (долгий процесс обтёсывания)
# ──────────────────────────────────────────────────────────────────────────────
- type: constructionGraph
  id: StoneAnvilFromBoulder
  start: boulder
  graph:
    - node: boulder
      entity: FloraRockSolid
      edges:
        # Обтесать валун в грубую форму
        - to: roughShape
          steps:
            - tool: Hammering
              doAfter: 15
    - node: roughShape
      entity: StoneAnvilWorkbenchFrame
      edges:
        # Завершить обработку
        - to: fin
          completed:
            - !type:AddFactionComponent
            - !type:PointsFromCraft
              points: 100
          steps:
            - tool: Hammering
              doAfter: 10
        # Разобрать обратно в камни
        - to: destroy
          completed:
            - !type:SpawnPrototype
              prototype: Stone
              amount: 5
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 8
    - node: fin
      entity: StoneAnvilWorkbench
      edges:
        - to: destroy
          completed:
            - !type:SpawnPrototype
              prototype: Stone
              amount: 8
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 15
    - node: destroy

