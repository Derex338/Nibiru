  start: start
  graph:
    - node: start
      edges:
        - to: frame
          steps:
            - material: WoodStick
              amount: 4
              doAfter: 2
    - node: frame
      entity: ResearchTableFrame
      edges:
        - to: fin
          completed:
            - !type:AddFactionComponent
            - !type:PointsFromCraft
              points: 100
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 3
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 3
