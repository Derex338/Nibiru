- type: gamePreset
  id: Nibiru
  alias:
    - nibiru
  name: Nibiru survival
  description: Голопопое выживание
  rules:
    - NibiruSurvival
    #- BasicNibiruEventScheduler
    #- BasicNibiruRoundstartVariation

- type: entity
  id: NibiruSurvival
  parent: BaseGameRule
  components:
    - type: NibiruSurvivalRule
      biome: NibiruContinental
      caveBiome: NibiruCaveStandard
      dayDuration: 1800 #30 min

- type: entityTable
  id: BasicNibiruGameRulesTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: BasicNibiruEvents

- type: entity
  id: BasicNibiruEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: BasicNibiruGameRulesTable
