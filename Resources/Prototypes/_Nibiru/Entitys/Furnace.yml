- type: entity
  id: BaseMold
  parent: BaseItem
  name: mold
  description: A stone furnace for smelting ore into molten metal.
  components:
  - type: Sprite
    sprite: _Nibiru/furnace.rsi
    layers:
      - map: [ enum.FuelLightVisualLayers.Base ]
        state: icon
      - map: [ enum.FuelLightVisualLayers.Glow ]
        state: lit
        color: "#FFFFFF"
        visible: false
        shader: unshaded
  - type: SolutionContainerManager
    solutions:
      smelted_metal:
        maxVol: 10
  - type: Mold
    resultEntities: 
      CopperMolten: Fuel
    slot: result_container
  - type: InjectableSolution
    solution: smelted_metal
  - type: RefillableSolution
    solution: smelted_metal
  - type: ItemSlots
    slots:
      result_container:
        #whitelist:
        #  components:
        #  - Item
        blacklist:
          components:
          - SolutionContainerManager
          - Item
  - type: ContainerContainer
    containers:
      result_container: !type:ContainerSlot
  - type: CoolInWater
    solution: result_container
  - type: Temperature