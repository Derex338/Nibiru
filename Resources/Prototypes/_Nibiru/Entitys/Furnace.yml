- type: entity
  id: SmeltingFurnace
  name: smelting furnace
  description: A stone furnace for smelting ore into molten metal.
  components:
  - type: Sprite
    sprite: _Nibiru/furnace.rsi
    layers:
      - map: [ enum.FuelLightVisualLayers.Base ]
        state: icon
      - map: [ enum.FuelLightVisualLayers.Glow ]
        state: lit
        color: "#FFFFFF"
        visible: false
  - type: Appearance
  - type: Transform
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: SmeltingFurnace
    containerId: ore_container
    maxOreCapacity: 10
    heatingRate: 80    # Быстро нагревается
    coolingRate: 20    # Медленно остывает
    solution: smelted_metal
  - type: SolutionContainerManager
    solutions:
      smelted_metal:
        maxVolume: 500
  - type: DrainableSolution
    solution: smelted_metal
  - type: PointLight
    enabled: false
    color: "#E25822"
    radius: 0.5
    energy: 2.0
  - type: FuelConsumption
    glowDuration: 100
    fadeOutDuration: 4
    iconStateSpent: icon
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
    # Sounds legit nuff
    litSound:
      path: /Audio/Items/Flare/flare_on.ogg
  - type: Clickable
  - type: InteractionOutline
  - type: LightBehaviour
    behaviours:
      - !type:RandomizeBehaviour # immediately make it bright and flickery
        id: turn_on
        interpolate: Nearest
        minDuration: 0.02
        maxDuration: 0.06
        startValue: 2.0
        endValue: 4.0
        property: Energy
        isLooped: true
      - !type:FadeBehaviour # have the radius start small and get larger as it starts to burn
        id: turn_on
        maxDuration: 8.0
        startValue: 1.0
        endValue: 2.0
      - !type:RandomizeBehaviour # weaker flicker as it fades out
        id: fade_out
        interpolate: Nearest
        minDuration: 0.02
        maxDuration: 0.06
        startValue: 4.0
        endValue: 8.0
        property: Energy
        isLooped: true
      - !type:FadeBehaviour # fade out radius as it burns out
        id: fade_out
        maxDuration: 4.0
        startValue: 2.0
        endValue: 1.0
  
- type: entity
  id: CopperOre
  name: copper ore
  description: A chunk of copper ore.
  components:
  - type: Sprite
    sprite: Objects/Materials/ore.rsi
    state: copper_ore
  - type: Item
    size: Small
  - type: Stack
    count: 1
    stackType: CopperOre
  - type: SmeltableOre
    meltingPoint: 1000      # Медь плавится легче железа
    meltingSpeed: 0.2
    resultReagent: CopperMolten
    resultAmount: 99
    resultTemperature: 1100
  - type: Temperature
  
- type: reagent
  id: CopperMolten
  name: molten copper
  desc: Molten copper, glowing orange-red.
  physicalDesc: molten-metal
  flavor: metallic
  color: "#ff8844"
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: 18