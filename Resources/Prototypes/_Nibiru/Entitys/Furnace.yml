- type: entity
  id: SmeltingFurnace
  name: smelting furnace
  description: A stone furnace for smelting ore into molten metal.
  components:
  - type: Sprite
    sprite: _Nibiru/furnace.rsi
    layers:
      - map: [ enum.FuelLightVisualLayers.Base ]
        state: icon
      - map: [ enum.FuelLightVisualLayers.Glow ]
        state: lit
        color: "#FFFFFF"
        visible: false
        shader: unshaded
  - type: Appearance
  - type: Transform
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: SmeltingFurnace
    containerId: ore_container
    solutionContainerId: solution_container
    maxOreCapacity: 10
    heatingRate: 80    # Быстро нагревается
    coolingRate: 20    # Медленно остывает
    solution: smelted_metal
  - type: SolutionContainerManager
    solutions:
      smelted_metal:
        maxVol: 100
  - type: DrainableSolution
    solution: smelted_metal
  - type: PointLight
    enabled: false
    color: "#E25822"
    radius: 0.5
    energy: 2.0
    netsync: false
  - type: FuelConsumption
    maxFuelAmount: 1800                   # 30 минут работы
    targetBurnTemperature: 1400           # Высокая температура для плавки
    minOperatingTemperature: 800          # Работает при 800°C+
    heatingRate: 40                       # Медленно нагревается
    coolingRate: 15                       # Очень медленно остывает
    fuelConsumptionRate: 0.5              # Экономный расход
    fadeOutDuration: 30
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
    iconStateSpent: icon
    # Sounds legit nuff
    litSound:
      path: /Audio/Items/Flare/flare_on.ogg
  - type: Clickable
  - type: InteractionOutline
  - type: LightBehaviour
    behaviours:
      - !type:RandomizeBehaviour # immediately make it bright and flickery
        id: turn_on
        interpolate: Nearest
        minDuration: 0.02
        maxDuration: 0.06
        startValue: 2.0
        endValue: 4.0
        property: Energy
        isLooped: true
      - !type:FadeBehaviour # have the radius start small and get larger as it starts to burn
        id: turn_on
        maxDuration: 8.0
        startValue: 1.0
        endValue: 2.0
      - !type:RandomizeBehaviour # weaker flicker as it fades out
        id: fade_out
        interpolate: Nearest
        minDuration: 0.02
        maxDuration: 0.06
        startValue: 4.0
        endValue: 8.0
        property: Energy
        isLooped: true
      - !type:FadeBehaviour # fade out radius as it burns out
        id: fade_out
        maxDuration: 4.0
        startValue: 2.0
        endValue: 1.0
  - type: ItemSlots
    slots:
      solution_container:
        whitelist:
          components:
          - FitsInDispenser
  - type: ContainerContainer
    containers:
      solution_container: !type:ContainerSlot
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand
  - type: Temperature
  
- type: entity
  id: CopperOre
  name: copper ore
  parent: BaseItem
  description: A chunk of copper ore.
  components:
  - type: Sprite
    sprite: Objects/Materials/ore.rsi
    state: iron
  - type: Item
    size: Small
  - type: Stack
    count: 1
    stackType: CopperOre
  - type: SmeltableOre
    meltingPoint: 950      # Медь плавится легче железа
    meltingSpeed: 1
    resultReagent: CopperMolten
    resultAmount: 50
    resultTemperature: 1100
  - type: Temperature
  - type: Clickable
  - type: InteractionOutline
  
- type: reagent
  id: CopperMolten
  name: copper
  group: Elements
  desc: reagent-desc-silver
  physicalDesc: reagent-physical-desc-reasonably-metallic
  flavor: metallic
  color: "#ff8844"
  boilingPoint: 2212.0
  meltingPoint: 960.5
  scrapEntity: ScrapMetal
            
- type: stack
  id: CopperOre
  name: copper ore
  spawn: CopperOre
  maxCount: 30
  
