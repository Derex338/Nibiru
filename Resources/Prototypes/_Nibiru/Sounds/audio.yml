- type: ambientMusic
  id: NibiruDesertMusic
  sound:
    params:
      volume: -8
    collection: NibiruDesertAmbience
  rules: NibiruDesert
  fadeIn: true
  interruptable: true
  priority: 2

## Fallback if nothing else found
- type: ambientMusic
  id: NibiruMining
  sound:
    params:
      volume: -12
    collection: NibiruPlanetaryAmbience
  rules: AlwaysTrue
  fadeIn: true
  interruptable: true
  priority: 1

# Rules
- type: rules
  id: NibiruForestDay
  rules:
    - !type:CEIsNight
      inverted: true
    - !type:StayOnTileRule
      biomeId: NibiruPackForests

- type: rules
  id: NibiruForestNight
  rules:
    - !type:CEIsNight
    - !type:StayOnTileRule
      biomeId: NibiruPackForests

- type: rules
  id: NibiruFieldDay
  rules:
    - !type:CEIsNight
      inverted: true
    - !type:StayOnTileRule
      biomeId: NibiruPackGrasslands

- type: rules
  id: NibiruFieldNight
  rules:
    - !type:CEIsNight
    - !type:StayOnTileRule
      biomeId: NibiruPackGrasslands

- type: rules
  id: NibiruDesert
  rules:
    - !type:StayOnTileRule
      biomeId: NibiruDesert

