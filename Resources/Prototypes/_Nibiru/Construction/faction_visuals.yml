- type: constructionGraph
  id: FactionVisuals
  start: start
  graph:
    - node: banner
      entity: FactionBanner
    - node: flag
      entity: FactionFlag
    - node: start
      edges:
        - to: banner
          completed:
            - !type:SetFactionVisuals
          steps:
            - material: WoodStick
              amount: 1
            - material: Cloth
              amount: 2
              doAfter: 3
        - to: flag
          completed:
            - !type:SetFactionVisuals
          steps:
            - material: WoodStick
              amount: 1
            - material: Cloth
              amount: 1
              doAfter: 2

- type: construction
  id: FactionBanner
  name: construction-recipe-faction-banner
  graph: FactionVisuals
  startNode: start
  targetNode: banner
  category: construction-category-decor
  objectType: Structure
  placementMode: SnapgridCenter

- type: construction
  id: FactionFlag
  name: construction-recipe-faction-flag
  graph: FactionVisuals
  startNode: start
  targetNode: flag
  category: construction-category-decor
  objectType: Structure
  placementMode: SnapgridCenter
