- type: construction
  id: MultiLevelRope
  name: hanging rope
  graph: MultiLevelRope
  startNode: start
  targetNode: rope
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: true
  canRotate: true
  conditions:
    - !type:MultiLevelTileCondition
      offsets: [-1]
      requireSpace: true
      useRotation: true

- type: constructionGraph
  id: MultiLevelRope
  start: start
  graph:
    - node: start
      edges:
        - to: peg
          steps:
            - material: WoodStick
              amount: 1
    - node: peg
      entity: CERopePeg
      edges:
        - to: rope
          steps:
            - material: HerbRope
              amount: 3
    - node: rope
      entity: CERopeTop

- type: entity
  id: CERopeBase
  parent: BaseStructure
  abstract: true
  components:
    - type: Sprite
      sprite: _Nibiru/EpochSpecified/StoneAge/Structures/Kolishek.rsi
      state: front
      rotation: 180
    - type: Physics
      canCollide: false
    - type: MultiLevelConstruction
    - type: Damageable
    - type: Injurable
      damageContainer: StructuralInorganic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: MultiLevelClimbable
      climbDuration: 2.0
    - type: InteractionOutline

- type: entity
  id: CERopePeg
  parent: CERopeBase
  name: колышек
  components:
    - type: Sprite
      sprite: _Nibiru/EpochSpecified/StoneAge/Structures/Kolishek.rsi
      state: clear
      rotation: 180
    - type: Construction
      graph: MultiLevelRope
      node: peg

- type: entity
  id: CERopeTop
  parent: CERopeBase
  name: колышек с веревкой
  components:
    - type: Sprite
      sprite: _Nibiru/EpochSpecified/StoneAge/Structures/Kolishek.rsi
      state: front
      rotation: 180
    - type: Construction
      graph: MultiLevelRope
      node: rope
    - type: MultiLevelConstruction
      isOrigin: true
      offsetByRotation: true
      projections:
        - offset: -1
          prototype: CERopeHanging

- type: entity
  id: CERopeHanging
  parent: CERopeBase
  name: свисающая веревка
  components:
    - type: Sprite
      sprite: _Nibiru/EpochSpecified/StoneAge/Structures/Kolishek.rsi
      state: rope
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.2
          mask:
            - GhostImpassable
          layer:
            - MidImpassable
          density: 1
          hard: false
