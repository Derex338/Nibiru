# Пример прототипа лошади как транспорта
- type: entity
  id: MobHorseRideable
  parent: MobPig
  name: rideable horse
  description: A majestic horse you can ride.
  components:
  - type: Strap # Обязательный компонент для посадки
    position: Stand
    buckleOffset: "0,0.15"
  - type: Rideable # Компонент транспорта
    locomotionType: Legs
    canMoveWhenDead: false
    baseState: horse
    mountedState: horse_mounted
  - type: InputMover
  - type: MobMover
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5.0