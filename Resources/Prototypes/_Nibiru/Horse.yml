# Пример прототипа лошади как транспорта
- type: entity
  id: MobHorseRideable
  parent: MobPig
  name: rideable horse
  description: A majestic horse you can ride.
  components:
  - type: Rideable # Важно чтобы этот компонент был выше чем Strap
    locomotionType: Legs
    canMoveWhenDead: false
    baseState: horse
    mountedState: horse_mounted
  - type: Strap 
  - type: Inventory
    templateId: BaseHorse
  - type: Puller
    needsHands: false # Тоже обязательно, иначе тащить не будет
  - type: RequireProjectileTarget
    
- type: entity
  id: Saddle
  parent: Clothing
  name: saddle
  description: A majestic horse you can ride.
  components:
  - type: Clothing
    slots: [back]
  - type: Saddle
  - type: Sprite
    sprite: Clothing/Back/Backpacks/backpack.rsi
    state: icon
  - type: Item
    size: Huge
    
- type: inventoryTemplate
  id: BaseHorse
  slots:
    - name: back
      slotTexture: back
      slotFlags: BACK
      stripTime: 5
      uiWindowPos: 1,0
      strippingWindowPos: 0,1
      displayName: Back
      whitelist:
        components:
        - Saddle