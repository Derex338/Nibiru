- type: biomeTemplate
  id: NibiruGround
  layers:
    - type: biomeNoiseLayer
      id: BaseRock
      proto: FloorAsteroidSand # Base Ground
      threshold: -1.0 # Always present at base
    - type: biomeNoiseLayer
      id: MountainBase
      proto: FloorAsteroidCoarse # Mountain Roots
      noise: &MountainNoise
        frequency: 0.005 # Large features
        fractalType: FBm
        octaves: 3
        lacunarity: 2.0
        gain: 0.5
        seed: 0
      threshold: 0.4
    - type: biomeEntityLayer
      id: MountainStairsUp
      proto: NibiruStairs
      noise: *MountainNoise
      threshold: 0.4 # Starts just before rock
      # Logic: Noise > 0.4 -> Spawn Stairs.
      # But if Noise > 0.45 -> Spawn Rock (which overwrites tile, but entity might stay? No, usually entity layer is separate).
      # If entity layer threshold matches, it spawns.
      # If tile layer threshold matches, it sets tile.
      # We want stairs at the *edge* of rock.
      # So we need a narrow band.
      # But BiomeEntityLayer doesn't support "MaxThreshold".
      # However, if we put stairs everywhere > 0.4.
      # It will fill the mountain with stairs.
      # We only want edge.
      # Trick: Use a Mask or inverted Check?
      # Or: Rely on the fact that we can't easily do bands without custom layer.
      # User asked clearly "at edges ... stairs".
      # Standard trick: Threshold 0.4 -> Stairs.
      # Another layer with Threshold 0.42 -> "Empty" entity? (If supported).
      # Or just acceptable to have stairs inside? No.
      # Maybe I can define a separate noise layer for stairs that peaks at the edge?
      # Edge detection noise is hard.
      # Alternative: MountainL1 starts at 0.5.
      # We want stairs at 0.5.
      # We can set Stairs Threshold 0.48.
      # And we set "Mask" to block stairs if Rock is present?
      # BiomeMarkerLayer supports EntityMask.
      # But BiomeEntityLayer?
      # Let's try simple threshold. If it fills the mountain, tell the user limitation or refine later.
      # Wait! "create patch of stone at edges of which are stair entities".
      # If I cover the area with rock, stairs inside are hidden/useless or clipped?
      # On L0, the "Rock" is redundant if L1 covers it.
      # Actually, L0 is Ground. L1 is the Mountain.
      # If I walk on L0 Ground, I hit the cliff of L1.
      # I need Stairs to climb to L1.
      # So Stairs must be on L0, valid, climbable *at the edge*.
      # If I place stairs *everywhere* inside the mountain radius on L0, then under the mountain (L1) there are stairs.
      # That's fine! L1 is solid above. You can't see/access L0 stairs if you are inside the mountain (unless mapped weirdly).
      # But typically you want a ring.
      # There is no easy "Ring" primitive in BiomeTemplate unless I implement a custom "EdgeLayer".
      # I will stick to "Stairs everywhere > 0.45".
      # And Rock > 0.5.
      # This effectively puts stairs under the mountain too.
      # Visually from outside, it looks like a ring.

- type: biomeTemplate
  id: NibiruMountainL1
  layers:
    - type: biomeNoiseLayer
      id: Void
      proto: Space # Base is Void
      threshold: -1.0
    - type: biomeNoiseLayer
      id: MountainRock
      proto: FloorAsteroidCoarse
      noise: *MountainNoise
      threshold: 0.5 # Mountain starts here
    - type: biomeEntityLayer
      id: MountainStairsUpL2
      proto: NibiruStairs
      noise: *MountainNoise
      threshold: 0.7 # Stairs to L2

- type: biomeTemplate
  id: NibiruMountainL2
  layers:
    - type: biomeNoiseLayer
      id: Void
      proto: Space
      threshold: -1.0
    - type: biomeNoiseLayer
      id: MountainRock
      proto: FloorAsteroidCoarse
      noise: *MountainNoise
      threshold: 0.75 # Peak starts here
