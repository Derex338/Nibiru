# =============================================================
# BIOMES FOR CAVES AND MINES
# =============================================================

# Обычная каменистая шахта с углем
- type: biomeTemplate
  id: NibiruCaveStandard
  layers:
    # --- Кристаллы (красота на полу) ---
    - !type:BiomeEntityLayer
      threshold: 0.92
      noise:
        seed: 502
        noiseType: OpenSimplex2
        frequency: 1.5
      allowedTiles:
        - CEStone
      entities:
        - CrystalBlue
        - CrystalCyan
        - CrystalGreen
        - CEFloorCrystal
        - CECrystalGrowths
    # --- Основные стены камня (с проходами) ---
    # Используем инвертированный Perlin Ridged шум для создания "коридоров"
    - !type:BiomeEntityLayer
      threshold: -0.6
      invert: true
      noise:
        seed: 500
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - CEStone
      entities:
        - CEWallStone

    # --- Угольная руда (кучками внутри стен) ---
    - !type:BiomeEntityLayer
      threshold: 0.7
      noise:
        seed: 501
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.1
      allowedTiles:
        - CEStone
      entities:
        - CEWallStoneOreCoal

    # --- Медная руда ---
    - !type:BiomeEntityLayer
      threshold: 0.75
      noise:
        seed: 503
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.12
      allowedTiles:
        - CEStone
      entities:
        - CEWallStoneOreCopper

    # --- Оловянная руда ---
    - !type:BiomeEntityLayer
      threshold: 0.78
      noise:
        seed: 504
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.12
      allowedTiles:
        - CEStone
      entities:
        - CEWallStoneOreTin

    # --- Серебряная руда (редко) ---
    - !type:BiomeEntityLayer
      threshold: 0.85
      noise:
        seed: 506
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.15
      allowedTiles:
        - CEStone
      entities:
        - CEWallStoneOreSilver

    # --- Золотая руда (очень редко) ---
    - !type:BiomeEntityLayer
      threshold: 0.9
      noise:
        seed: 507
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.15
      allowedTiles:
        - CEStone
      entities:
        - CEWallStoneOreGold

    # --- Подложка (пол) ---
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: CEStone
