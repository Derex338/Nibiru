      threshold: 0.85
      noise:
        seed: 1
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CEGrass
        - CEDirt
      entities:
        - CERockSmall
        - CERockBigMoss
    # --- Камни-штуки (редкие) ---
