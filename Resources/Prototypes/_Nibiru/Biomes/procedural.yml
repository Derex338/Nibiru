        seed: 0
        noiseType: OpenSimplex2
        frequency: 1
      divisions: 1
      threshold: 0.55
      decals:
        - CEFloraGrass1
        - CEFloraGrass2
        - CEFloraGrass3
        - CEFloraGrass4
        - CEFloraGrass5
    # --- Камни (entity, редко) ---
