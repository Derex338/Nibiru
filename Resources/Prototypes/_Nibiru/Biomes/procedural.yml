      allowedTiles:
        - CEGrass
        - CEGrassLight
      divisions: 2
      threshold: -0.45
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 1
      decals:
        - CEGrassBushes1
        - CEGrassBushes2
        - CEGrassBushes3
    # --- Трава-декали ---
