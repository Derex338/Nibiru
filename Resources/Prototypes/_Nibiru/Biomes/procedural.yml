# =============================================================
# NIBIRU PROCEDURAL BIOME GENERATION
# =============================================================
# Структура:
#   Листовые биомы (конкретное содержимое)
#     -> Пак биомов (≤3 штуки через BiomeMetaLayer)
#     -> Мега-пак (combinator of packs)
#
# Реки / озёра используют единый сид (seed: 99, frequency: 0.003)
# во всех биомах чтобы продолжались через границы.
# =============================================================

# =============================================================
# МЕГА-БИОМ — собирает паки по 2-3 штуки
# =============================================================

- type: biomeTemplate
  id: NibiruContinental
  layers:
    # Общая база — луга (фолбэк)
    - !type:BiomeMetaLayer
      template: NibiruPackGrasslands
    # Пак лесов (берёза + ель) по оси X
    - !type:BiomeMetaLayer
      template: NibiruPackForests
      threshold: 0.15
      noise:
        seed: 10
        frequency: 0.0008
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 3
        lacunarity: 2
    # Пак снега (зима) — перекрывает всё при высокой «широте»
    - !type:BiomeMetaLayer
      template: NibiruPackSnow
      threshold: 0.55
      noise:
        seed: 11
        frequency: 0.0007
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2
    # Пустыня — противоположный полюс
    - !type:BiomeMetaLayer
      template: NibiruDesert
      threshold: 0.7
      noise:
        seed: 12
        frequency: 0.0007
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2

# =============================================================
# ПАК ЛУГОВ — луга + цветочная поляна + опушка
# =============================================================

- type: biomeTemplate
  id: NibiruPackGrasslands
  layers:
    - !type:BiomeMetaLayer
      template: NibiruGrasslands
    - !type:BiomeMetaLayer
      template: NibiruFlowerMeadow
      threshold: 0.3
      noise:
        seed: 20
        frequency: 0.003
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2
    - !type:BiomeMetaLayer
      template: NibiruEdgeland
      threshold: -0.3
      noise:
        seed: 21
        frequency: 0.004
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2

# =============================================================
# ПАК ЛЕСОВ — густой берёзовый + не густой берёзовый + еловый
# =============================================================

- type: biomeTemplate
  id: NibiruPackForests
  layers:
    - !type:BiomeMetaLayer
      template: NibiruBirchForestDense
    - !type:BiomeMetaLayer
      template: NibiruBirchForestLight
      threshold: -0.2
      noise:
        seed: 30
        frequency: 0.005
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2
    - !type:BiomeMetaLayer
      template: NibiruSpruceForestDense
      threshold: 0.35
      noise:
        seed: 31
        frequency: 0.004
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2

# Расширение пака лесов — ещё подбиомы подключаем через второй мета-пак
- type: biomeTemplate
  id: NibiruPackForests2
  layers:
    - !type:BiomeMetaLayer
      template: NibiruSpruceForestLight
    - !type:BiomeMetaLayer
      template: NibiruBirchForestDense
      threshold: 0.25
      noise:
        seed: 32
        frequency: 0.004
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2

# =============================================================
# ПАК СНЕГА — густой снег + менее густой
# =============================================================

- type: biomeTemplate
  id: NibiruPackSnow
  layers:
    - !type:BiomeMetaLayer
      template: NibiruSnow
    - !type:BiomeMetaLayer
      template: NibiruSnowLight
      threshold: -0.3
      noise:
        seed: 40
        frequency: 0.004
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2

