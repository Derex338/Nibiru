      allowedTiles:
        - CEGrass
        - CEDirt
      divisions: 1
      threshold: 0.72
      noise:
        seed: 1
        noiseType: Cellular
        frequency: 0.6
      decals:
        - CEFloraRock01
        - CEFloraRock02
        - CEFloraRock03
        - CEFloraRock04
        - CEFloraRock05
    # --- Кусты-декали (редкие) ---
