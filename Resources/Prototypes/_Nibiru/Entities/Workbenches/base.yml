- type: entity
  id: BaseWorkbench
  parent: BaseStructure
  name: верстак
  abstract: true
  components:
  - type: UserInterface
    interfaces:
      enum.WorkbenchUiKey.Key:
        type: WorkbenchBoundUserInterface
  - type: ActivatableUI
    key: enum.WorkbenchUiKey.Key
    requiresComplex: true
  - type: Appearance
  - type: WiresVisuals
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
          - MachineLayer
  - type: Workbench
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Transform
    anchored: true
  - type: Pullable
  - type: StaticPrice
    price: 800
  - type: Construction
    graph: BasicWorkbench
    node: fin
  - type: Sprite
    sprite: Structures/Furniture/Tables/wood.rsi
    state: full
  - type: InteractionOutline

- type: entity
  id: SpindleWorkbench
  parent: BaseWorkbench
  name: верстак прядения
  description: Используется для создания нитей и веревок.
  components:
  - type: Sprite
    sprite: _CE/Structures/Furniture/Tables/workbench.rsi
    state: filler
  - type: Construction
    graph: Workbench
    node: fin

- type: entity
  id: LoomWorkbench
  parent: BaseWorkbench
  name: ткацкий станок
  description: Используется для создания тканей.
  components:
  - type: Sprite
    sprite: _CE/Structures/Furniture/Tables/workbench.rsi
    state: tanner_table
  - type: Construction
    graph: LoomWorkbench
    node: fin

- type: entity
