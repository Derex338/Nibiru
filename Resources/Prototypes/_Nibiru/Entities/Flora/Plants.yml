# продукты

- type: entity
  name: сноп пшеницы
  id: NibiruWheatBushel
  parent: ProduceBaseRuminant
  components:
    - type: Sprite
      sprite: _CE/Objects/Consumable/Food/wheat.rsi
      state: base1
      layers:
        - state: base1
          map: ["0"]
    - type: SolutionContainerManager
      solutions:
        food:
          reagents:
          - ReagentId: Flour
            Quantity: 10
    - type: Produce
      seedId: NibiruWheat
    - type: RandomSprite
      available:
