- type: entity
  parent: BaseTree
  id: GrowTreeFirst
  name: tree
  components:
  - type: Sprite
    sprite: Decals/Flora/flora_bushes.rsi
    layers:
    - state: bushk1
      map: ["random"]
  - type: RandomSprite
    available:
      - random:
          bushk1: ""
          bushk2: ""
          bushk3: ""
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/tree_fell.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          Log:
            min: 0
            max: 1
  - type: Timer
  - type: TimedSpawner
    prototypes:
    #- GrowTreeSecond
    - GrowTreeFour
    intervalSeconds: 10
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
  - type: TimedDespawn
    lifetime: 11
  - type: Fixtures
    fixtures:
      itemcollide:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.14,-0.05,0.15,0.25"
        layer:
        - HighImpassable
        hard: false
  - type: Construction
    graph: GrowTree
    node: fin

