# ─────────────────────────────────────────────────────────────────────────────
# Модульное оружие — базовые прототипы для крафта
# ─────────────────────────────────────────────────────────────────────────────

# Базовая сущность модульного оружия (абстрактная, не появляется в игре напрямую)
- type: entity
  id: ModularWeaponBase
  abstract: true
  name: modular weapon
  description: A weapon forged by hand from individual components.
  components:
    - type: Item
      size: Normal
    - type: MeleeWeapon
      damage:
        types:
          Slash: 8
    - type: ModularCraft

# Модульный меч
- type: entity
  id: ModularSword
  parent: ModularWeaponBase
  name: forged sword
  description: A sword assembled from individual smithing modules.
  components:
    - type: Sprite
      sprite: _Nibiru/EpochSpecified/BronzeAge/Weapons/Melee/BronzeSword.rsi
      state: icon
    - type: Item
      size: Normal

# Модульный нож
- type: entity
  id: ModularKnife
  parent: ModularWeaponBase
  name: forged knife
  description: A handcrafted knife made from selected modules.
  components:
    - type: Sprite
      sprite: _Nibiru/EpochSpecified/BronzeAge/Tools/Knife.rsi
      state: icon
    - type: Item
      size: Small

# Модульный топор
- type: entity
  id: ModularAxe
  parent: ModularWeaponBase
  name: forged axe
  description: An axe assembled piece by piece in the forge.
  components:
    - type: Sprite
      sprite: _Nibiru/EpochSpecified/BronzeAge/Tools/Hatchet.rsi
      state: icon
    - type: Item
      size: Normal

# Модульное копьё
- type: entity
  id: ModularSpear
  parent: ModularWeaponBase
  name: forged spear
  description: A spear with a choice of head and shaft.
  components:
    - type: Sprite
      sprite: Objects/Weapons/Melee/spear.rsi
      state: spear
    - type: Item
      size: Large

# ─────────────────────────────────────────────────────────────────────────────
# Верстак-кузня (структура)
# ─────────────────────────────────────────────────────────────────────────────

- type: entity
  id: NibiruModularCraft
  parent: BaseStructure
  name: smithy workbench
  description: A workbench for hand-crafting modular weapons. Interact to open the smithy menu.
  components:
    - type: Sprite
      sprite: Structures/Machines/autolathe.rsi
      layers:
        - state: icon
    - type: InteractionOutline
    - type: ModularCraft
      currentItemType: Sword
      baseEntityPrototype: ModularSword
    - type: UserInterface
      interfaces:
        enum.ModularCraftUiKey.Key:
          type: ModularCraftBoundUserInterface
    - type: ActivatableUI
      key: enum.ModularCraftUiKey.Key

