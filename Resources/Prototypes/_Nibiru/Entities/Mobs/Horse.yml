- type: entity
  id: MobHorseRideable
  parent:
  - MobPig
  - BaseSlicingRefinable
  name: rideable horse
  suffix: Nibiru
  description: A majestic horse you can ride.
  components:
  - type: Construction
    graph: Horse
    node: fin
    deconstructionTarget: null
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHorse
  - type: Rideable # Важно чтобы этот компонент был выше чем Strap
    locomotionType: Legs
    canMoveWhenDead: false
    baseState: horse
    mountedState: horse_mounted
  - type: Strap
  - type: Inventory
    templateId: BaseHorse
  - type: Puller
    needsHands: false # Тоже обязательно отключить, иначе тащить не будет
  - type: RequireProjectileTarget
  - type: Sprite
    drawdepth: Mobs
    offset: 0,-0.3
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: horse
      sprite: _Nibiru/Entities/Mobs/Horse.rsi
  - type: MovementSpeedModifier
    baseWalkSpeed: 10
  - type: InputMover
  - type: MobMover
  - type: Physics
  - type: Tag
    tags:
    - FootstepSound
    - VimPilot
  - type: PointsFromKill
    points: 50
  - type: Body
  - type: ToolRefinable
    refineResult:
    - id: HideBig
      amount: 1
    - id: BigBodyButcherFirst
      amount: 1


- type: entity
  id: Saddle
  parent: Clothing
  name: седло
  suffix: Nibiru
  description: Кожаное седло с бронзовыми вставками для верховой езды.
  components:
  - type: Clothing
    slots: [back]
  - type: Saddle
  - type: Sprite
    sprite: _Nibiru/EpochSpecified/BronzeAge/Clothing/Saddle.rsi
    state: icon
  - type: Item
    size: Huge
  - type: Construction
    graph: Saddle
    node: fin

- type: inventoryTemplate
  id: BaseHorse
  slots:
    - name: back
      slotTexture: back
      slotFlags: BACK
      stripTime: 5
      uiWindowPos: 1,0
      strippingWindowPos: 0,1
      displayName: Back
      whitelist:
        components:
        - Saddle
