      path: /Audio/Animals/goat_bah.ogg
    fleeSound:
      path: /Audio/Animals/goat_bah.ogg
  - type: NibiruTamable
    diet: Herbivore
    trustThreshold: 40
    trainable: true
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 8
  - type: NibiruLivestock
    canBreed: true
  - type: NibiruAnimalSex
  - type: NibiruAnimalBreeder
    speciesId: goat
    gestationTime: 360
    breedingCooldown: 720
    minOffspringCount: 1
    maxOffspringCount: 2
    growth:
      growTime: 1200
      startScale: 0.5
      adultScale: 1
  - type: NibiruAnimalProducts
    harvestableResources:
    - itemPrototype: MaterialCloth1
      growthTime: 180
      yield: 1
      requiredTool: CEScissors
  - type: Butcherable
    spawned:
    - id: HideMedium
      amount: 1
    - id: MediumBodyButcherFirst
      amount: 1



- type: entity
  id: MobNibiruChicken
  parent:
  - NibiruAnimalBase
  - MobChicken
  name: курица
  description: Птица, дающая яйца.
  components:
  - type: NibiruNpcBehavior
    ambientSound:
      path: /Audio/_Nibiru/Mobs/Chicken/AmbientSound.ogg
    deathSound:
      path: /Audio/_Nibiru/Mobs/Chicken/DeathSound.ogg
    hurtSound:
      path: /Audio/_Nibiru/Mobs/Chicken/HurtSound.ogg
    fleeSound:
      path: /Audio/_Nibiru/Mobs/Chicken/FleeSound.ogg
  - type: NibiruSleepCycle
  - type: NibiruLeashable
    leashSound:
      path: "/Audio/_Nibiru/Mobs/Chicken/LeashSound .ogg"
      params:
        volume: -2
  - type: NibiruTamable
    diet: Herbivore
    trustThreshold: 10
    feedingSound:
      path: /Audio/_Nibiru/Mobs/Chicken/FeedingSound.ogg
      params:
        volume: -2
    tamedSound:
      path: /Audio/_Nibiru/Mobs/Chicken/TamedSound.ogg
      params:
        volume: -2
    followSound:
      path: /Audio/_Nibiru/Mobs/Chicken/FollowSound.ogg
      params:
        volume: -2
  - type: NibiruLivestock
    canBreed: false
    birthSound:
      path: /Audio/_Nibiru/Mobs/Chicken/BirthSound.ogg
      params:
        volume: -2
  - type: EggLayer
    eggSpawn:
    - id: FoodEgg
  - type: Butcherable
    spawned:
    - id: SmallBodyButcherBird
      amount: 1
    - id: HideSmall
      amount: 1

