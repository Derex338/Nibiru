    behaviorType: Aggressive
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 3.0
  - type: MeleeWeapon
    damage:
      types:
        Slash: 20
  - type: NpcFactionMember
    factions:
    - SimpleHostile

# Почтовый голубь (Для проверки доставки)
- type: entity
  id: MobNibiruPigeon
  parent: NibiruAnimalBase
  name: почтовый голубь
  description: Маленькая, но очень важная птица.
  components:
  - type: Sprite
    sprite: Mobs/Animals/butterfly.rsi
    state: butterfly
  - type: NibiruNpcStateMachine
    behaviorType: Passive
  - type: NibiruTamable
    diet: Herbivore
    trustThreshold: 20
    trainable: true
    possibleCommands: [ Follow, Stay, Deliver ]
    learnedCommands: [ Follow, Stay, Deliver ]
  - type: NibiruBird
  - type: Item
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.0
    baseSprintSpeed: 1.5
  - type: Storage
    clickInsert: true
    grid:
    - 1,1,1,2
    maxItemSize: Large
    storageInsertSound:
      path: /Audio/Voice/Slime/slime_squish.ogg
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

# Голубятня (Для проверки доставки)
- type: entity
  id: NibiruPigeonPost
  parent: BaseStructure
  name: голубятня
  description: Место, куда слетаются почтовые птицы.
  components:
  - type: Sprite
    sprite: Objects/Storage/petcarrier.rsi
    state: icon
  - type: Transform
    anchored: true
  - type: InteractionOutline
  - type: NibiruPigeonPost
    postName: Центральная Голубятня
  - type: ContainerContainer
    containers:
      bird_delivery_cage: !type:Container
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: UserInterface
    interfaces:
      enum.NibiruRenamePostUiKey.Key:
        type: NibiruBirdPostRenameBoundUserInterface

