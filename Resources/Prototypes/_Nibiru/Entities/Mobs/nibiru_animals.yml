- type: entity
  id: NibiruAnimalBase
  parent: SimpleMobBase
  abstract: true
  components:
  - type: ActiveNPC
  - type: NPCSteering
  - type: NibiruNpcBehavior
    memoryDuration: 60
    patrolRadius: 10
    combatStyle: Default
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 3.0
  - type: NibiruNpcPerception
    visionRange: 15
    hearingRange: 10
  - type: NibiruAnimalMood
  - type: NibiruAnimalAbility
  - type: Damageable
    damageContainer: Biological
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: UserInterface
    interfaces:
      enum.NibiruAnimalTrainingUiKey.Key:
        type: NibiruAnimalTrainingBoundUserInterface
      enum.NibiruBirdDeliveryUiKey.Key:
        type: NibiruBirdDeliveryBoundUserInterface

# Волк (Агрессивный, стайный)
- type: entity
  id: MobNibiruWolf
  parent: NibiruAnimalBase
  name: волк
  description: Опасный хищник Нибиру. Охотится стаями.
  components:
  - type: Sprite
    sprite: _Nibiru/Entities/Mobs/Wolf.rsi
    state: Wolf
  - type: NibiruNpcBehavior
    combatStyle: Default
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 3.0
  - type: NibiruTamable
    diet: Carnivore
    trustThreshold: 70
    maxTrust: 150
    favoriteFoods: [ FoodMeatSteak, NibiruFoodMeatTest ]
    trainable: true
    possibleCommands: [ Follow, Stay, Attack, Guard, Search ]
  - type: NibiruSleepCycle
    isNocturnal: true
  - type: NibiruFireFear
    fireDetectionRange: 8
    fireTags: [ "Fire", "Torch", "Candle", "Lighter" ]
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 15
  - type: Butcherable
    spawned:
    - id: HideMedium
      amount: 1
    - id: MediumBodyButcherFirst
      amount: 1
  - type: NpcFactionMember
    factions:
    - SimpleHostile

# Овца (Мирная, ресурсная, приручаемая)
- type: entity
  id: MobNibiruSheep
  parent: NibiruAnimalBase
  name: овца
  description: Пушистое создание. Даёт шерсть.
  components:
  - type: Sprite
    sprite: Mobs/Animals/goat.rsi
    state: goat
  - type: NibiruNpcBehavior
    behaviorType: Passive
    fleeRange: 7
    fleeDistance: 15
    combatStyle: Default
  - type: NibiruTamable
    diet: Herbivore
    trustThreshold: 40
    maxTrust: 100
    acceptedFood: [ FoodApple, FoodWheat ]
    favoriteFoodTags: [ Fruit ]
    trainable: true
    possibleCommands: [ Follow, Stay ]
  - type: NibiruLivestock
    canBreed: true
    offspringPrototype: MobNibiruLamb
    harvestableResources:
    - itemPrototype: NibiruWool
      growthTime: 300
      yield: 2
      requiredTool: Scissors
    femaleSprite:
      sprite: Mobs/Animals/goat.rsi
      state: goat
    maleSprite:
      sprite: Mobs/Animals/goat.rsi
      state: goat
  - type: NibiruLeashable
  - type: NibiruSleepCycle
    isNocturnal: false
    sleepDuration: 300
    wakeDuration: 600
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.0
    baseSprintSpeed: 1.5
  - type: Butcherable
    spawned:
    - id: HideMedium
      amount: 1
    - id: MediumBodyButcherFirst
      amount: 1

