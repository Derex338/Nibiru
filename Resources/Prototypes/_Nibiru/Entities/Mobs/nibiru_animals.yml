- type: entity
  id: NibiruAnimalBase
  parent: SimpleMobBase
  abstract: true
  components:
  - type: ActiveNPC
  - type: NPCSteering
  - type: NibiruNpcStateMachine
    behaviorType: Neutral
  - type: NibiruNpcCombat
    combatStyle: Default
  - type: NibiruNpcAggro
    aggroRange: 8
    deaggroRange: 15
    fleeRange: 6
    fleeDistance: 12
  - type: NibiruNpcMemory
    memoryDuration: 60
  - type: NibiruNpcPatrol
    patrolRadius: 10
    patrolInterval: 5
  - type: NibiruNpcAudio
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 3.0
  - type: NibiruNpcPerception
    visionRange: 15
    hearingRange: 10
  - type: NibiruAnimalMood
  - type: NibiruAnimalAbility
  - type: NibiruAnimalSleep
  - type: Damageable
    damageContainer: Biological
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: UserInterface
    interfaces:
      enum.NibiruAnimalTrainingUiKey.Key:
        type: NibiruAnimalTrainingBoundUserInterface
      enum.NibiruBirdDeliveryUiKey.Key:
        type: NibiruBirdDeliveryBoundUserInterface

- type: entity
  id: MobNibiruPig
  parent: NibiruAnimalBase
  name: свинья
  description: Хрю-хрю.
  components:
  - type: Sprite
    sprite: Mobs/Animals/pig.rsi
    state: pig
  - type: NibiruTamable
    diet: Omnivore
    trustThreshold: 30
    trainable: true
  - type: NibiruLivestock
    canBreed: true
    offspringPrototype: MobNibiruPiglet
  - type: NibiruAnimalSex
  - type: NibiruAnimalBreeder
    speciesId: pig
    offspringPrototype: MobNibiruPiglet
    gestationTime: 300
    breedingCooldown: 600
    minOffspringCount: 2
    maxOffspringCount: 4
    growth:
      growTime: 900
      startScale: 0.5
      adultScale: 1
      adultPrototype: MobNibiruPig
      modifierSteps:
      - progress: 0.3
        modifier: 0.2
      - progress: 0.5
        modifier: 0.5
      - progress: 0.7
        modifier: 0.8
  - type: Butcherable
    spawned:
    - id: HideMedium
      amount: 1
    - id: MediumBodyButcherFirst
      amount: 1

- type: entity
  id: MobNibiruPiglet
  parent: MobNibiruPig
  name: Поросёнок
  description: Мини хрю-хрю.
  components:
  - type: NibiruAnimalGrowth
