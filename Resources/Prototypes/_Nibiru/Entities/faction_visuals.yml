- type: entity
  id: FactionBanner
  parent: BannerBase
  name: faction banner
  description: A banner with your faction's logo and colors.
  components:
  - type: Sprite
    sprite: _Nibiru/Entities/banner.rsi
    layers:
    - state: banner_down
    - state: banner_bg
      map: [ "enum.FactionVisualLayers.Background" ]
    - state: banner_icon
      map: [ "enum.FactionVisualLayers.Logo" ]
  - type: FactionVisuals
  - type: Construction
    graph: FactionVisuals
    node: banner

- type: entity
  id: FactionFlag
  parent: BaseFlag
  name: faction flag
  description: A flag with your faction's logo and colors.
  components:
  - type: Sprite
    sprite: _Nibiru/Entities/banner.rsi
    layers:
    - state: blank_flag
      sprite: Structures/Wallmounts/flags.rsi
      map: [ "enum.FactionVisualLayers.Background" ]
    - state: banner_icon
      map: [ "enum.FactionVisualLayers.Logo" ]
  - type: FactionVisuals
  - type: Construction
    graph: FactionVisuals
    node: flag
