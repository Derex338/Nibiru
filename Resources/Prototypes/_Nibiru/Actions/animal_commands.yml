- type: entity
  id: ActionNibiruAnimalFollow
  parent: BaseAction
  name: Следуй за мной
  description: Приказывает всем вашим животным следовать за вами.
  components:
  - type: InstantAction
    icon: { sprite: Mobs/Pets/corgi.rsi, state: corgi }
    event: !type:NibiruAnimalFollowActionEvent
      speech: Следуй за мной!

- type: entity
  id: ActionNibiruAnimalStay
  parent: BaseAction
  name: Стоять
  description: Приказывает всем вашим животным оставаться на месте.
  components:
  - type: InstantAction
    icon: { sprite: Markers/cross.rsi, state: cross }
    event: !type:NibiruAnimalStayActionEvent
      speech: Стоять!

- type: entity
  id: ActionNibiruAnimalAttack
  parent: BaseAction
  name: Взять!
  description: Включает режим атаки. Укажите на цель, чтобы отправить животное атаковать.
  components:
  - type: InstantAction
    icon: { sprite: Objects/Weapons/Melee/sword.rsi, state: icon }
    event: !type:NibiruAnimalAttackActionEvent
      speech: Взять его!
    useDelay: 1
    checkCanInteract: false

- type: entity
  id: ActionNibiruAnimalGrab
  parent: BaseAction
  name: Схвати!
  description: Включает режим захвата. Укажите на цель, чтобы животное схватило и тащило её.
  components:
  - type: InstantAction
    icon: { sprite: Objects/Weapons/Melee/baton.rsi, state: icon }
    event: !type:NibiruAnimalGrabActionEvent
      speech: Схвати его!
    useDelay: 1
    checkCanInteract: false

- type: entity
  id: ActionNibiruAnimalSearch
  parent: BaseAction
  name: Ищи!
  description: Дать питомцу понюхать предмет, чтобы найти его владельца по запаху.
  components:
  - type: InstantAction
    icon: { sprite: Objects/Misc/tracker.rsi, state: tracker }
    event: !type:NibiruAnimalSearchActionEvent
      speech: Ищи!
    checkCanInteract: false
    useDelay: 4

- type: entity
  id: ActionNibiruAnimalDeliver
  parent: BaseAction
  name: Доставка
  description: Отправить птицу в известное почтовое отделение.
  components:
  - type: InstantAction
    icon: { sprite: Objects/Misc/box.rsi, state: box_6 }
    event: !type:NibiruAnimalDeliverActionEvent
      speech: Лети!
