- type: entity
  save: false
  name: Urist McCookie
  parent:
  - BaseMobSpeciesOrganic
  - BaseSlicingRefinable
  id: BaseMobGingerbread
  abstract: true
  components:
  - type: Icon
    sprite: Mobs/Species/Gingerbread/parts.rsi
    state: full
  - type: Body
  - type: Damageable
    damageModifierSet: Gingerbread
  - type: Injurable
    damageContainer: Biological
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#896e55"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: ToolRefinable
    refineResult:
      - id: FoodBakedCookie #should be replaced with gingerbread sheets or something... provided you're willing to make a full spriteset of those.
        amount: 5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Sugar
        Quantity: 100
      - ReagentId: Butter
        Quantity: 200
# Adventure start
  - type: GhostRole
    prob: 1
    name: ghost-role-information-gingerbread-name
    allowMovement: true
    description: ghost-role-information-gingerbread-description
    rules: ghost-role-information-nonantagonist-rules
# Adventure end
  - type: GhostTakeoverAvailable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100 #fairly light
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: TypingIndicator
    proto: gingerbread
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female


- type: entity
  parent: BaseSpeciesDummy
  id: MobGingerbreadDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
