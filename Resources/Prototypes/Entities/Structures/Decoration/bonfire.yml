- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseBonfire
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/bonfire.rsi
  - type: PointLight
    enabled: true
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: WoodDestroy
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: AmbientSound
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: ItemPlacer
    maxEntities: 4 
    whitelist:
      components:
      - Temperature
  - type: PlaceableSurface
  - type: Clickable
  - type: Construction #Nibiru
    graph: Bonfire
    node: fin
  - type: AlwaysHot
  - type: IgnitionSource
    temperature: 700
    ignited: true
  - type: RequireProjectileTarget

- type: entity
  parent: BaseBonfire
  id: Bonfire
  name: bonfire
  description: What can be better than a late evening under the sky with guitar and friends?
  components:
  - type: Sprite
    layers:
    - state: burning
  - type: Construction
    graph: Bonfire
    node: bonfire

- type: entity
  parent: BaseBonfire
  id: BonfireStake
  name: bonfire with stake
  description: A sinister bonfire with a stake for... ceremonial purposes. Best not to ask.
  components:
  - type: Sprite
    sprite: Structures/Decoration/bonfire_stake.rsi
    layers:
    - state: burning
    offset: "0, 0.5"
  - type: Strap
    position: Stand
    buckleOffset: "0, 0.4"
    buckleDoafterTime: 5
  - type: IgniteOnBuckle
  - type: Construction
    graph: Bonfire
    node: bonfireStake

- type: entity
  parent: BaseBonfire
  id: LegionnaireBonfire
  name: legionnaire bonfire
  description: There, in the land of lava and ash, place to to cook marshmallow and potato.
  components:
  - type: Sprite
    layers:
    - state: legionnaire_bonfire
  - type: PointLight
    color: "#FF5601"
    
# ==================== КОСТЁР С НАГРЕВОМ ====================
- type: entity
  id: Campfire
  parent: BaseStructure
  name: костёр
  description: Открытый костёр. Можно готовить на нём еду и греть предметы.
  components:
  - type: Sprite
    sprite: Structures/Decoration/bonfire.rsi
    layers:
      - map: [ enum.FuelLightVisualLayers.Base ]
        state: bonfire
      - map: [ enum.FuelLightVisualLayers.Glow ]
        state: burning
        #color: "#FFFFFF"
        visible: false
        shader: unshaded
  # Система топлива
  - type: FuelConsumption
    maxFuelAmount: 600                    # 10 минут
    targetBurnTemperature: 600            # Средняя температура
    minOperatingTemperature: 3          # Работает при 300°C+
    heatingRate: 100
    coolingRate: 60
    fuelConsumptionRate: 0.1
    fadeOutDuration: 20
    turnOnBehaviourID: campfire_lit
    fadeOutBehaviourID: campfire_dying
    iconStateSpent: bonfire
    loopedSound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  # Поверхность для нагрева
  - type: HeatingSurface
    heatingRate: 80                       # Быстро нагревает
    burnTemperature: 350                  # Сжигает при 500°C
    minSourceTemperature: 300             # Нужна температура 300°C+
    requirePlacedOnSurface: true          # Только предметы НА костре
    cookingSound:
      path: /Audio/Effects/sizzle.ogg
    cookingSoundInterval: 4.0
  - type: PlaceableSurface
  - type: PointLight
    enabled: false
    radius: 12
    energy: 2.5
    color: "#ff6600"
  - type: LightBehaviour
    behaviours:
      - !type:RandomizeBehaviour
        id: campfire_lit
        interpolate: Linear
        maxCycles: 0
        minValue: 0.8
        maxValue: 1.3
        isLooped: true
      - !type:PulseBehaviour
        id: campfire_dying
        interpolate: Linear
        maxCycles: 0
        minValue: 0.2
        maxValue: 0.5
        isLooped: true
  - type: Appearance
  - type: ItemPlacer
    maxEntities: 4 
    whitelist:
      components:
      - Temperature
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      itemcollide:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.14,-0.05,0.15,0.25"
        layer:
        - HighImpassable
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        hard: true

