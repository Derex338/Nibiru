- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceInsect
  categories: [ HideSpawnMenu ]
  name: insect appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Adventure/Races/Insect/displacement.rsi
            state: Uniforms
  - type: InitialBody
    organs:
      Torso: TorsoInsect
      Head: HeadInsect
      ArmLeft: LeftArmInsect
      ArmRight: RightArmInsect
      HandRight: RightHandInsect
      HandLeft: LeftHandInsect
      LegLeft: LeftLegInsect
      LegRight: RightLegInsect
      FootLeft: LeftFootInsect
      FootRight: RightFootInsect
      Brain: OrganInsectBrain
      Eyes: OrganInsectEyes
      Lungs: OrganInsectLungs
      Stomach: OrganInsectStomach
  - type: HumanoidProfile
    species: InsectSerpentide

- type: entity
  parent: OrganBaseOrganic
  id: OrganInsect
  abstract: true
  suffix: insect

- type: entity
  id: OrganInsectMetabolizer
  abstract: true
  components:
