  name: воск
  description: мягкий воск, только что выплюнутый.
  suffix: Full
  components:
  - type: PhysicalComposition
    materialComposition:
      WebSilk: 100
  - type: Sprite
    sprite: _Adventure/Races/Insect/Structures.rsi
    state: wax
  - type: Stack
    count: 20
    stackType: InsectWax
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fiber
        Quantity: 3
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 3
        reagents:
        - ReagentId: Fiber
          Quantity: 3
  - type: Tag
    tags:
      - ClothMade

- type: entity
  parent: MaterialWax
  id: MaterialWax1
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: stack
  id: InsectWax
  name: воск
  icon: { sprite: /Textures/_Adventure/Races/Insect/Structures.rsi, state: wax }
  spawn: MaterialWax1
  maxCount: 20

#пол
- type: entity
  id: InsectWaxTile
  name: напольный воск
  placement:
    mode: SnapgridCenter
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Clickable
  - type: Sprite
    sprite: _Adventure/Races/Insect/Structures.rsi
    layers:
      - state: tile
    drawdepth: FloorTiles
  - type: Icon
    sprite: _Adventure/Races/Insect/Structures.rsi
    state: tile
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection:
      collection: LarvaFootStep
      params:
        volume: -5
  - type: Tag
    tags:
      - Catwalk
  - type: Construction
    graph: InsectStructures
    node: tile
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: InsectArmor
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWax1:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: AliensWallDestroy
  - type: TrayScanReveal
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.9
    sprintSpeedModifier: 0.9
    ignoreWhitelist:
      tags:
      - SpiderCraft
      - InsectCraft

