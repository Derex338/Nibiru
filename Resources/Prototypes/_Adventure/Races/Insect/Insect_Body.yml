#Тело серпентида
- type: entity
  id: PartInsect
  parent: [BaseItem, OrganBaseOrganic]
  name: "Часть тела серпентида"
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/Insect/Species/parts.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 10

- type: entity
  id: TorsoInsect
  name: "Туловище серпентида"
  parent: [PartInsect, OrganBaseTorso]
  components:
  - type: Sprite
    sprite: _Adventure/Races/Insect/Species/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 20

