- type: species
  id: Resomi
  name: Резоми
  roundStart: true
  prototype: MobResomi
  sprites: MobResomiSprites
  markingLimits: MobResomiMarkingLimits
  dollPrototype: MobResomiDummy
  skinColoration: Hues
  defaultSkinTone: "#36c9c0"
  minAge: 15
  youngAge: 30
  oldAge: 40
  maxAge: 64
  maleFirstNames: NamesResomiMale
  femaleFirstNames: NamesResomiFemale
  naming: First

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceResomi
  categories: [ HideSpawnMenu ]
  name: resomi appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoHuman
      Head: HeadHuman
      ArmLeft: LeftArmHuman
      ArmRight: RightArmHuman
      HandRight: RightHandHuman
      HandLeft: LeftHandHuman
      LegLeft: LeftLegHuman
      LegRight: RightLegHuman
      FootLeft: LeftFootHuman
      FootRight: RightFootHuman
      Brain: OrganResomiBrain
      Eyes: OrganResomiEyes
      Lungs: OrganResomiLungs
      Heart: OrganResomiHeart
      Stomach: OrganResomiStomach
      Liver: OrganResomiLiver
      Kidneys: OrganResomiKidneys
  - type: HumanoidProfile
    species: Resomi

- type: entity
  parent: OrganHuman
  id: OrganResomiExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/Resomi/Species/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Resomi/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Resomi
﻿#Тело Резоми
- type: entity
  id: PartResomi
  parent: [BaseItem, OrganBaseOrganic]
  name: "Часть тела резоми"
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/Resomi/Species/parts.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: ResomiBlood
        Quantity: 10

- type: entity
  id: TorsoResomi
  name: "Туловище резоми"
  parent: [PartResomi, OrganBaseTorso]
  components:
