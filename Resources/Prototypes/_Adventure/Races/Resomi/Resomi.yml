    count: 50

- type: entity
  name: MobResomi
  parent:
  - AppearanceResomi
  - BaseSpeciesMobOrganic
  id: MobResomi
  components:
  - type: Sprite
    scale: 0.6, 0.6
  - type: Icon
    sprite: _Adventure/Races/Resomi/Species/parts.rsi
    state: full
  - type: Body
    prototype: Resomi
    requiredLegs: 2
  - type: Hunger
  - type: Thirst
  - type: Speech
    speechSounds: ResomiSpeech
  - type: Vocal
    sounds:
      Male: MaleResomi
      Female: FemaleResomi
      Unsexed: MaleResomi
  - type: TypingIndicator
    proto: bird
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: ResomiBlood
        Quantity: 300
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 5
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 3
  - type: Inventory
    speciesId: Resomi
    templateId: Resomi

- type: entity
  parent: BaseSpeciesDummy
  id: MobResomiDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: VisualBody
  - type: HumanoidProfile
    species: Resomi
  - type: Sprite
    scale: 0.6, 0.6

