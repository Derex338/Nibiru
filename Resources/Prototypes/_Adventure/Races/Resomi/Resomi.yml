- type: species
  id: Resomi
  name: Резоми
  roundStart: true
  prototype: MobResomi
  dollPrototype: AppearanceResomi
  skinColoration: Hues
  defaultSkinTone: "#36c9c0"
  minAge: 15
  youngAge: 30
  oldAge: 40
  maxAge: 64
  maleFirstNames: NamesResomiMale
  femaleFirstNames: NamesResomiFemale
  naming: First

- type: markingsGroup
  parent: Undergarments
  onlyGroupWhitelisted: true
  id: Resomi
  limits:
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ ResomiTailBase ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ ResomiEarsBase ]
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: true
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceResomi
  categories: [ HideSpawnMenu ]
  name: resomi appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoResomi
      Head: HeadResomi
      ArmLeft: LeftArmResomi
      ArmRight: RightArmResomi
      HandRight: RightHandResomi
      HandLeft: LeftHandResomi
      LegLeft: LeftLegResomi
      LegRight: RightLegResomi
      FootLeft: LeftFootResomi
      FootRight: RightFootResomi
      Brain: OrganResomiBrain
      Eyes: OrganResomiEyes
      Lungs: OrganResomiLungs
      Heart: OrganResomiHeart
      Stomach: OrganResomiStomach
      Liver: OrganResomiLiver
      Kidneys: OrganResomiKidneys
  - type: HumanoidProfile
    species: Resomi
  - type: Inventory
    speciesId: Resomi
    templateId: Resomi

- type: entity
  parent: OrganHuman
  id: OrganResomiExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/Resomi/Species/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Resomi/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Resomi
      #layers: []

- type: entity
  id: PartResomi
  parent: [BaseItem, OrganBaseOrganic]
  name: "Часть тела резоми"
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/Resomi/Species/parts.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: ResomiBlood
        Quantity: 10
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Resomi/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Resomi
      #layers: []

