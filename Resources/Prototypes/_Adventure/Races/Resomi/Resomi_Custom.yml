- type: body
  name: "Резоми"
  id: Resomi
  root: torso
  slots:
    head:
      part: HeadResomi
      connections:
      - torso
      organs:
        brain: OrganResomiBrain
        eyes: OrganResomiEyes
    torso:
      part: TorsoResomi
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      organs:
        heart: OrganResomiHeart
        lungs: OrganResomiLungs
        stomach: OrganResomiStomach
        liver: OrganResomiLiver
        kidneys: OrganResomiKidneys
    right arm:
      part: RightArmResomi
      connections:
      - right hand
    left arm:
      part: LeftArmResomi
      connections:
      - left hand
    right hand:
      part: RightHandResomi
    left hand:
      part: LeftHandResomi
    right leg:
      part: RightLegResomi
    left leg:
      part: LeftLegResomi

