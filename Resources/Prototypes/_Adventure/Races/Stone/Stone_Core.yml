- type: species
  id: Stone
  name: Голем
  roundStart: true
  prototype: MobStone
  sprites: MobStoneSprites
  markingLimits: MobStoneMarkingLimits
  dollPrototype: MobStoneDummy
  skinColoration: Hues
  defaultSkinTone: "#868991"
  minAge: 1
  youngAge: 100
  oldAge: 25000
  maxAge: 50000
  sexes:
    - Unsexed
  maleFirstNames: NamesStone
  femaleFirstNames: NamesStone
  naming: First

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceStone
  categories: [ HideSpawnMenu ]
  name: stone appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoHuman
      Head: HeadHuman
      ArmLeft: LeftArmHuman
      ArmRight: RightArmHuman
      HandRight: RightHandHuman
      HandLeft: LeftHandHuman
      LegLeft: LeftLegHuman
      LegRight: RightLegHuman
      FootLeft: LeftFootHuman
      FootRight: RightFootHuman
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Stone

- type: entity
  parent: OrganHuman
  id: OrganStoneExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/Stone/Species/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Stone/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Stone
﻿- type: entity
  id: SpawnOreRandomStone
  parent: MarkerBase
  components:
  - type: RandomSpawner
    prototypes:
      - GoldOre1
      - UraniumOre1
      - DiamondOre1
      - SteelOre1
      - SilverOre1
      - SpaceQuartz1

#Мозг
- type: entity
  id: StoneBrain
  name: камень души
  parent: BaseItem
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Stone
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SpawnOreRandomStone:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: Sprite
    sprite: _Adventure/Races/Stone/organs.rsi
    layers:
    - state: brain
  - type: Organ
  - type: Brain
  - type: Input
    context: "ghost"
  - type: InputMover
  - type: Examiner
  - type: BlockMovement

#Тело
- type: entity
  id: PartStone
  parent: BaseItem
  name: "Stone body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Stone
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
      - Trash
  - type: Sprite
    sprite: _Adventure/Races/Stone/Species/parts.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SpawnOreRandomStone:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

