- type: loadoutEffectGroup
  id: StoneOre
  effects:
  - !type:SpeciesLoadoutEffect
    species:
    - Stone

- type: loadout
  id: EmergencyStone
  effects:
  - !type:GroupLoadoutEffect
    proto: StoneOre
  storage:
    back:
    - Coal10

- type: species
  id: Stone
  name: Golem
  roundStart: true
  prototype: MobStone
  dollPrototype: AppearanceStone
  skinColoration: Hues
  defaultSkinTone: "#868991"
  minAge: 1
  youngAge: 100
  oldAge: 25000
  maxAge: 50000
  sexes:
    - Unsexed
  maleFirstNames: NamesStone
  femaleFirstNames: NamesStone
  naming: First

- type: markingsGroup
  parent: Undergarments
  onlyGroupWhitelisted: true
  id: Stone
  limits:
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [StoneBase]


- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceStone
  categories: [ HideSpawnMenu ]
  name: stone appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoStone
      Head: HeadStone
      ArmLeft: LeftArmStone
      ArmRight: RightArmStone
      HandRight: RightHandStone
      HandLeft: LeftHandStone
      LegLeft: LeftLegStone
      LegRight: RightLegStone
      FootLeft: LeftFootStone
      FootRight: RightFootStone
      Brain: StoneBrain
      Eyes: OrganHumanEyes
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Stone
  - type: Inventory
    speciesId: Stone
    templateId: Stone

- type: entity
  parent: OrganHuman
  id: OrganStoneExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/Stone/Species/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Stone/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Stone
      #layers: []

- type: entity
  id: SpawnOreRandomStone
  parent: MarkerBase
  components:
  - type: RandomSpawner
    prototypes:
      - GoldOre1
      - UraniumOre1
      - DiamondOre1
      - SteelOre1
      - SilverOre1
      - SpaceQuartz1

#Мозг
- type: entity
  id: StoneBrain
  name: soul stone
  parent: OrganHumanBrain
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: AdventureStone
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SpawnOreRandomStone:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: Sprite
    sprite: _Adventure/Races/Stone/organs.rsi
    layers:
    - state: brain

