- type: entity
  name: MobStone
  parent:
  - AppearanceStone
  - BaseSpeciesMob
  id: MobStone
  components:
  - type: Icon
    sprite: _Adventure/Races/Stone/Species/parts.rsi
    state: full
  - type: Body
    prototype: Stone
    requiredLegs: 2
  - type: Hunger
  - type: Thirst
  - type: Speech
    speechSounds: StoneSpeach
  - type: Vocal
    sounds:
      Male: StoneEmote
      Female: StoneEmote
      Unsexed: StoneEmote
  - type: BodyEmotes
    soundsId: StoneBodyEmotes
  - type: Damageable
    damageContainer: Stone
    damageModifierSet: AdventureStone
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 8
