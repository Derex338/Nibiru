- type: body
  name: "Stone"
  id: Stone
  root: torso
  slots:
    head:
      part: HeadStone
      connections:
      - torso
    torso:
      part: TorsoStone
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      organs:
        brain: StoneBrain
    right arm:
      part: RightArmStone
      connections:
      - right hand
    left arm:
      part: LeftArmStone
      connections:
      - left hand
    right hand:
      part: RightHandStone
    left hand:
      part: LeftHandStone
    right leg:
      part: RightLegStone
    left leg:
      part: LeftLegStone

