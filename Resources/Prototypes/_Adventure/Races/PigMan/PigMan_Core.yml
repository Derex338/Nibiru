- type: species
  id: PigMan
  name: Троттин
  roundStart: true
  prototype: MobPigMan
  sprites: MobPigManSprites
  markingLimits: MobPigManMarkingLimits
  dollPrototype: MobPigManDummy
  skinColoration: HumanToned
  minAge: 18
  youngAge: 25
  oldAge: 42
  maxAge: 70

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearancePigMan
  categories: [ HideSpawnMenu ]
  name: pigman appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoPigMan
      Head: HeadPigMan
      ArmLeft: LeftArmPigMan
      ArmRight: RightArmPigMan
      HandRight: RightHandPigMan
      HandLeft: LeftHandPigMan
      LegLeft: LeftLegPigMan
      LegRight: RightLegPigMan
      FootLeft: LeftFootPigMan
      FootRight: RightFootPigMan
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: PigMan

- type: entity
  parent: OrganHuman
  id: OrganPigManExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/PigMan/Species/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/PigMan/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: PigMan
﻿- type: metabolizerType
  id: PigMan
  name: Свинолюд

- type: entity
  id: OrganPigManStomach
  parent: OrganHumanStomach
  name: Желудок троттина
  components:
  - type: Sprite
    sprite: _Adventure/Races/PigMan/organs.rsi
    state: stomach
  - type: Organ
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 100
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 7
  - type: Stomach
    specialDigestible:
      tags:
      - Trash
    isSpecialDigestibleExclusive: false
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [PigMan]

- type: entity
  id: OrganPigManHeart
  parent: OrganHumanHeart
  name: Сердце троттина
  description: тук тук
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Adventure/Races/PigMan/organs.rsi
    state: heart
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ PigMan ]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic

#Тело Троттина
- type: entity
  id: PartPigMan
  parent: [BaseItem, OrganBaseOrganic]
  name: "часть тела троттина"
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/PigMan/Species/parts.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 10
      - ReagentId: Fat
        Quantity: 10

- type: entity
  id: TorsoPigMan
  name: "Туловище троттина"
  parent: [PartPigMan, OrganBaseTorso]
