- type: emote
  id: Hru
  name: Хрюкать
  icon: _Adventure/Interface/Emotes/hru.png
  category: Vocal
  available: false
  whitelist:
    components:
    - Vocal
  blacklist:
    components:
    - BorgChassis
  chatMessages: ["Хрюкает"]
  chatTriggers:
    - хрюкает
    - хрюкнул

