  - sprite: _Adventure/Races/PigMan/Species/parts.rsi
    state: nose_base

- type: marking
  id: PigEarsBase
  bodyPart: HeadSide
  markingCategory: HeadSide
  followSkinColor: true
  forcedColoring: true
  groupWhitelist: [PigMan]
  sprites:
  - sprite: _Adventure/Races/PigMan/Species/parts.rsi
    state: ears_base

- type: species
  id: PigMan
  name: Trottin
  roundStart: true
  prototype: MobPigMan
  dollPrototype: AppearancePigMan
  skinColoration: HumanToned
  minAge: 18
  youngAge: 25
  oldAge: 42
  maxAge: 70

- type: markingsGroup
  parent: Undergarments
  onlyGroupWhitelisted: true
  id: PigMan
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
      default: [ PigEarsBase ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ PigNoseBase ]
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearancePigMan
  categories: [ HideSpawnMenu ]
  name: pigman appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoPigMan
      Head: HeadPigMan
      ArmLeft: LeftArmPigMan
      ArmRight: RightArmPigMan
      HandRight: RightHandPigMan
      HandLeft: LeftHandPigMan
      LegLeft: LeftLegPigMan
      LegRight: RightLegPigMan
      FootLeft: LeftFootPigMan
      FootRight: RightFootPigMan
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: PigMan
  - type: Inventory
    speciesId: PigMan
    templateId: PigMan

- type: entity
  parent: OrganHuman
  id: OrganPigManExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/PigMan/Species/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/PigMan/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: PigMan
      #layers: []

- type: metabolizerType
  id: PigMan
  name: PigMan

- type: entity
  id: OrganPigManStomach
  parent: OrganHumanStomach
  name: Trottin stomach
  components:
  - type: Sprite
    sprite: _Adventure/Races/PigMan/organs.rsi
    state: stomach
  - type: Organ
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 100
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 7
  - type: Stomach
    specialDigestible:
      tags:
      - Trash
    isSpecialDigestibleExclusive: false
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [PigMan]

- type: entity
  id: OrganPigManHeart
  parent: OrganHumanHeart
  name: Trottin heart
  description: тук тук
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Adventure/Races/PigMan/organs.rsi
    state: heart
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ PigMan ]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic

