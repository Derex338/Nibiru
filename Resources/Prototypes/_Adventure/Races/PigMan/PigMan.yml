- type: entity
  name: MobPigMan
  parent:
  - AppearancePigMan
  - BaseSpeciesMobOrganic
  id: MobPigMan
  components:
  - type: Icon
    sprite: _Adventure/Races/PigMan/Species/parts.rsi
    state: full
  - type: Body
    requiredLegs: 2
  - type: Hunger
  - type: Thirst
  - type: Speech
    speechVerb: Neco
    speechSounds: PigManSpeach
  - type: Vocal
    sounds:
      Male: MalePigMan
      Female: FemalePigMan
      Unsexed: MalePigMan
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: PigManBlood
        Quantity: 300
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 5
  - type: Inventory
    speciesId: PigMan
    templateId: PigMan

