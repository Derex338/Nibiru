- type: soundCollection
  id: DraskCryCollection
  files:
  - /Audio/_Adventure/Voice/Drask/octoCry1.ogg
  - /Audio/_Adventure/Voice/Drask/octoCry2.ogg

- type: speechSounds
  id: DraskSpeach
  saySound:
    path: /Audio/_Adventure/Voice/Drask/octoSpeak1.ogg
  askSound:
    path: /Audio/_Adventure/Voice/Drask/octoSpeak2.ogg
  exclaimSound:
    path: /Audio/_Adventure/Voice/Drask/octoSpeak3.ogg

- type: emoteSounds
  id: DraskEmote
  params:
    variation: 0.125
  sounds:
    Yawn:
      collection: MaleYawn
    Sneeze:
      collection: MaleSneezes
    Cough:
      collection: MaleCoughs
    Sigh:
      collection: MaleSigh
    Snore:
      collection: Snores
    Scream:
      collection: DraskScreamCollection
    Laugh:
      collection: DraskLaughCollection
    Honk:
      collection: BikeHorn
    Whistle:
      collection: Whistles
    Crying:
      collection: DraskCryCollection
    Weh:
      collection: Weh
    Gasp:
      collection: MaleGasp
    DefaultDeathgasp:
      collection: DraskDeadCollection

- type: speechVerb
  id: Octo
  name: chat-speech-verb-name-electricity
  speechVerbStrings:
