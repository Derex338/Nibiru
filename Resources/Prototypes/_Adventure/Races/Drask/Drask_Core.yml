# 🐙 Drask — core (vanilla types only)

- type: species
  id: Drask
  name: Драск
  roundStart: true
  prototype: MobDrask
  dollPrototype: AppearanceDrask
  skinColoration: Hues
  defaultSkinTone: "#2888a8"
  minAge: 30
  youngAge: 10000
  oldAge: 50000
  maxAge: 100000
  sexes:
    - Unsexed
  maleFirstNames: NamesDrask
  femaleFirstNames: NamesDrask
  naming: First

- type: damageModifierSet
  id: DraskCryo
  coefficients:
    Heat: 1.50
    Shock: 1.50
    Cold: 0.0
    Asphyxiation: 2.0

- type: reagent
  id: CryoxadoneDrask
  name: reagent-name-cryoxadone
  group: Toxins
  desc: reagent-desc-cryoxadone
  physicalDesc: reagent-physical-desc-fizzy
  flavor: medicine
  color: "#0091ff"
  metabolisms:
    Poison:
      metabolismRate: 0.50
      effects:
        - !type:HealthChange
          conditions:
          - !type:TemperatureCondition
            max: 213.15
          damage:
            groups:
              Burn: -1
            types:
              Slash: -1
              Piercing: -1
              Bloodloss: -1

- type: metabolizerType
  id: Drask
  name: Драск

- type: localizedDataset
  id: NamesDrask
  values:
    prefix: names-drask-dataset-
    count: 20

- type: soundCollection
  id: DraskScreamCollection
  files:
  - /Audio/_Adventure/Voice/Drask/octoScream1.ogg
  - /Audio/_Adventure/Voice/Drask/octoScream2.ogg
  - /Audio/_Adventure/Voice/Drask/octoScream3.ogg

- type: soundCollection
  id: DraskLaughCollection
