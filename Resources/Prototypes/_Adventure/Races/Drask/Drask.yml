- type: damageModifierSet
  id: DraskCryo
  coefficients:
    Heat: 1.50
    Shock: 1.50
    Cold: 0.0
    Asphyxiation: 2.0

- type: reagent
  id: CryoxadoneDrask # слабый криоксадон
  name: reagent-name-cryoxadone
  group: Toxins
  desc: reagent-desc-cryoxadone
  physicalDesc: reagent-physical-desc-fizzy
  flavor: medicine
  color: "#0091ff"
  metabolisms:
    Poison:
      metabolismRate: 0.50
      effects:
        - !type:HealthChange
          conditions:
          - !type:TemperatureCondition
            max: 213.15
          damage:
            groups:
              Burn: -1
            types:
              Slash: -1
              Piercing: -1
              Bloodloss: -1

- type: entity
  save: false
  name: Урист макТентакль
  parent: BaseMobDrask
  id: MobDrask

- type: entity
  abstract: true
  save: false
  parent: [BaseMobSpeciesOrganic, AppearanceDrask]
  id: BaseMobDrask
  name: Урист макТентакль
  components:
  - type: TypingIndicator
    proto: Drask
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: UrUAccent # Adventure-Accent
  - type: SolutionContainerManager
    solutions:
      bloodstream: # тупой, но рабочий костыль, 20u слабого приоксадона находятся в качестве введёного реагента и постоянно метаболизируются, но не реенерируют до достижения телом температуры в -40с.
        reagents: # upd: Костыль стал ещё тупее, но всё-равно работает
        - ReagentId: CryoxadoneDrask
          Quantity: 20
  - type: SolutionRegeneration
    solution: bloodstream
    generated:
      reagents:
      - ReagentId: CryoxadoneDrask
        Quantity: 0.50
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 6
        Structural: 5 #чуть структурного
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#0091ff"
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Cryoxadone
        Quantity: 300
  - type: Vocal
    sounds:
      Male: DraskEmote
      Female: DraskEmote
      Unsexed: DraskEmote
  - type: Speech
    speechSounds: DraskSpeach
    speechVerb: Octo
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 250
    sweatHeatRegulation: 500
    shiveringHeatRegulation: 500
    normalBodyTemperature: 291.15 # температура тела не поднимается сама по себе.
    thermalRegulationTemperatureThreshold: 2
  - type: Temperature
    currentTemperature: 291.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 298.15
    coldDamageThreshold: 3.15
    coldDamage:
      types:
        Cold : 0.0
    heatDamage:
      types:
        Heat : 2.0
  - type: TemperatureSpeed
    thresholds: # замедляются только при плюсовой температуре
      10273: 0.4
      298: 0.7
      295: 0.9
      294: 1.0
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: DraskCryo
  - type: Body
    prototype: Drask
    requiredLegs: 2
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: _Adventure/Races/Drask/Species/parts.rsi
    state: full
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatLizard
      amount: 5
  - type: Inventory
    speciesId: drask
    templateId: Drask
  - type: ScaleVisuals
    scale: 1, 1.1 # рост 2 метра.

- type: entity
  parent: BaseSpeciesDummy
  id: MobDraskDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: Inventory
    templateId: Drask
  - type: ScaleVisuals
    scale: 1, 1.1
﻿#Тело Драска
- type: body
  name: "Драск"
  id: Drask
  root: torso
  slots:
    head:
      part: HeadDrask
      connections:
      - torso
      organs:
        brain: OrganDraskBrain
        eyes: OrganDraskEyes
        heart: OrganDraskHeart # сердце в голове
    torso:
      part: TorsoDrask
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      organs:
        lungs: OrganDraskLungs
        stomach: OrganDraskStomach
        liver: OrganDraskLiver
        kidneys: OrganDraskKidneys
    right arm:
      part: RightArmDrask
      connections:
      - right hand
    left arm:
      part: LeftArmDrask
      connections:
      - left hand
    right hand:
      part: RightHandDrask
    left hand:
      part: LeftHandDrask
    right leg:
      part: RightLegDrask
    left leg:
      part: LeftLegDrask

