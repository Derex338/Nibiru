- type: species
  id: Felinid
  name: species-name-felinid
  roundStart: true
  sponsorOnly: true
  prototype: MobFelinid
  dollPrototype: MobFelinidDummy
  skinColoration: HumanToned
  minAge: 15
  youngAge: 25
  oldAge: 39
  maxAge: 65

- type: metabolizerType
  id: Felinid
  name: felinid

- type: speechVerb
  id: Neco
  name: chat-speech-verb-name-electricity
  speechVerbStrings:
  - мурчит
  - фыркает
  - мяукает

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFelinid
  categories: [ HideSpawnMenu ]
  name: felinid appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoHuman
      Head: HeadHuman
      ArmLeft: LeftArmHuman
      ArmRight: RightArmHuman
      HandRight: RightHandHuman
      HandLeft: LeftHandHuman
      LegLeft: LeftLegHuman
      LegRight: RightLegHuman
      FootLeft: LeftFootHuman
      FootRight: RightFootHuman
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Lungs: OrganHumanLungs
      Heart: OrganFelinidHeart
      Stomach: OrganFelinidStomach
      Liver: OrganFelinidLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Felinid

- type: entity
  parent: OrganHuman
  id: OrganFelinidExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Felinid

- type: entity
  id: OrganFelinidHeart
  parent: OrganHumanHeart
  name: felinid heart
  components:
  - type: Metabolizer
    metabolizerTypes: [Human]
    groups:
    - id: Medicine
      rateModifier: 1.25
    - id: Poison
      rateModifier: 1.25
    - id: Narcotic
      rateModifier: 1.25

- type: entity
  id: OrganFelinidLiver
  parent: OrganHumanLiver
  name: felinid liver
  components:
  - type: Metabolizer
    metabolizerTypes: [Human]
    groups:
    - id: Alcohol
      rateModifier: 0.1

- type: entity
  id: OrganFelinidStomach
  parent: OrganHumanStomach
  name: felinid stomach
  components:
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [Animal]
    groups:
    - id: Food
      rateModifier: 1.25
    - id: Drink
      rateModifier: 1.25
  - type: Stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  abstract: true
  save: false
  name: Urist McHands The Felinid
  parent:
  - AppearanceFelinid
  - BaseSpeciesMobOrganic
  id: BaseMobFelinid
  components:
  - type: TypingIndicator
    proto: Neco
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: Mobs/Species/Slime/parts.rsi
    state: full
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    scale: 0.85, 0.85
  - type: Body
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 120
        mask: [MobMask]
        layer: [MobLayer]
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: OwOAccent
  - type: Speech
    speechVerb: Neco
    allowedEmotes: ['Hissing']
  - type: Vocal
    sounds:
      Male: MaleNeco
      Female: FemaleNeco
      Unsexed: MaleNeco
  - type: MovementSpeedModifier
    weightlessAcceleration: 0.7
    weightlessFriction: 3
    weightlessModifier: 1

- type: entity
  save: false
  name: Urist McHands The Felinid
  parent: BaseMobFelinid
  id: MobFelinid

- type: entity
  parent: BaseSpeciesDummy
  id: MobFelinidDummy
  noSpawn: true
  components:
  - type: Sprite
    scale: 0.85, 0.85
