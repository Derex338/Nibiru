      required: true
      defaultMarkings: [ FelinidTail ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ FelinidEars ]
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 2
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false
- type: markingsGroup
  parent: Undergarments
  id: Felinid
  limits:
