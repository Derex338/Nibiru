- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFelinid
  categories: [ HideSpawnMenu ]
  name: felinid appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoHuman
      Head: HeadHuman
      ArmLeft: LeftArmHuman
      ArmRight: RightArmHuman
      HandRight: RightHandHuman
      HandLeft: LeftHandHuman
      LegLeft: LeftLegHuman
      LegRight: RightLegHuman
      FootLeft: LeftFootHuman
      FootRight: RightFootHuman
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Lungs: OrganHumanLungs
      Heart: OrganFelinidHeart
      Stomach: OrganFelinidStomach
      Liver: OrganFelinidLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Felinid

- type: entity
  parent: OrganHuman
  id: OrganFelinidExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Felinid
