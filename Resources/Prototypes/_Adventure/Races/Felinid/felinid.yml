- type: entity
  id: OrganFelinidHeart
  parent: OrganHumanHeart
  name: felinid heart
  components:
  - type: Metabolizer
    metabolizerTypes: [Human]

- type: entity
  id: OrganFelinidLiver
  parent: OrganHumanLiver
  name: felinid liver
  components:
  - type: Metabolizer
    metabolizerTypes: [Human]

- type: entity
  id: OrganFelinidStomach
  parent: OrganHumanStomach
  name: felinid stomach
  components:
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [Animal]
  - type: Stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  abstract: true
  save: false
  name: Urist McHands The Felinid
  parent:
  - AppearanceFelinid
  - BaseSpeciesMobOrganic
  - BaseSlicingRefinable
  id: BaseMobFelinid
  components:
  - type: TypingIndicator
    proto: Neco
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: Mobs/Species/Slime/parts.rsi
    state: full
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    scale: 0.85, 0.85
  - type: Body
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatHuman
      amount: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 120
        mask: [MobMask]
        layer: [MobLayer]
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: OwOAccent
  - type: Speech
    speechVerb: Neco
    allowedEmotes: ['Hissing']
  - type: Vocal
    sounds:
      Male: MaleNeco
      Female: FemaleNeco
      Unsexed: MaleNeco
  - type: MovementSpeedModifier
    weightlessAcceleration: 0.7
    weightlessFriction: 3
    weightlessModifier: 1
  - type: Inventory
    speciesId: Felinid
    templateId: Felinid
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 300

- type: entity
  save: false
  name: Urist McHands The Felinid
  parent: BaseMobFelinid
  id: MobFelinid

