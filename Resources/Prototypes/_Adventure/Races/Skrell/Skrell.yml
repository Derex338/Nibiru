    sprite: _Adventure/Races/Skrell/Species/parts.rsi
  - type: Extractable
    grindableSolutionName: blood
  - type: SolutionContainerManager
    solutions:
      blood:
        maxVol: 15
        reagents:
        - ReagentId: SkrellBlood
          Quantity: 10
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Skrell/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Skrell
      #layers: []

