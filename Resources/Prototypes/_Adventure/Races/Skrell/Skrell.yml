- type: entity
  id: OrganSkrellBrain
  parent: OrganHumanBrain

  description: Источник невероятного, бесконечного интеллекта.
  components:
  - type: Sprite
    sprite: _Adventure/Races/Skrell/organs.rsi
    state: brain

- type: entity
  id: OrganSkrellEyes
  parent: OrganHumanEyes

  description: Я тебя вижу
  components:
  - type: Sprite
    sprite: _Adventure/Races/Skrell/organs.rsi
    layers:
      - state: eyeball-l
      - state: eyeball-r

- type: entity
  id: OrganSkrellHeart
  parent: OrganHumanHeart

  description: Мне жаль бессердечного ублюдка, который потерял это.
  components:
  - type: Sprite
    sprite: _Adventure/Races/Skrell/organs.rsi
    layers:
    - state: heart-off

- type: entity
  id: OrganSkrellLungs
  parent: OrganHumanLungs

  description: Фильтрует кислород из атмосферы, который затем поступает в кровоток.
  components:
  - type: Sprite
    sprite: _Adventure/Races/Skrell/organs.rsi
    layers:
      - state: lung-l
      - state: lung-r

- type: entity
  id: OrganSkrellStomach
  parent: OrganHumanStomach

  description: Отвратительно. Это трудно переварить.
  components:
  - type: Sprite
    sprite: _Adventure/Races/Skrell/organs.rsi
    state: stomach

- type: entity
  id: OrganSkrellLiver
  parent: OrganHumanLiver

  description: Побереги меня.
  components:
  - type: Sprite
    sprite: _Adventure/Races/Skrell/organs.rsi
    state: liver

- type: entity
  id: OrganSkrellKidneys
