      Head: HeadSkrell
      ArmLeft: LeftArmSkrell
      ArmRight: RightArmSkrell
      HandRight: RightHandSkrell
      HandLeft: LeftHandSkrell
      LegLeft: LeftLegSkrell
      LegRight: RightLegSkrell
      FootLeft: LeftFootSkrell
      FootRight: RightFootSkrell
