    state: tails_base

- type: species
  id: Skrell
  name: species-name-skrell
  roundStart: true
  prototype: MobSkrell
  dollPrototype: AppearanceSkrell
  skinColoration: Hues
  defaultSkinTone: "#4dd7ab"
  minAge: 30
  youngAge: 120
  oldAge: 240
  maxAge: 400
  maleFirstNames: NamesSkrell
  femaleFirstNames: NamesSkrell
  naming: First

- type: markingsGroup
