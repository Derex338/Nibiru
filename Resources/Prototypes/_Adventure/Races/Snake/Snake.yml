- type: species
  id: Zerah
  name: species-name-zerah
  roundStart: true
  prototype: MobZerah
  #markingLimits: Zerah
  dollPrototype: AppearanceZerah
  skinColoration: Hues
  defaultSkinTone: "#bfa010"
  minAge: 12
  youngAge: 15
  oldAge: 25
  maxAge: 35
  maleFirstNames: NamesZerah
  femaleFirstNames: NamesZerah

- type: markingsGroup
  parent: Undergarments
  onlyGroupWhitelisted: true
  id: Zerah
  limits:
    enum.HumanoidVisualLayers.Snout:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ SnakeTailBase ]
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
      default: [ SnakeHeadBase ]

