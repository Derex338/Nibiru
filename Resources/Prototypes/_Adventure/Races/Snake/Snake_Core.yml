- type: species
  id: Zerah
  name: Зерах
  roundStart: true
  prototype: MobZerah
  markingLimits: MobZerahMarkingLimits
  dollPrototype: MobZerahDummy
  skinColoration: Hues
  defaultSkinTone: "#bfa010"
  minAge: 12
  youngAge: 15
  oldAge: 25
  maxAge: 35
  maleFirstNames: NamesZerah
  femaleFirstNames: NamesZerah

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceZerah
  categories: [ HideSpawnMenu ]
  name: zerah appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoSnake
      Head: HeadSnake
      ArmLeft: LeftArmSnake
      ArmRight: RightArmSnake
      HandRight: RightHandSnake
      HandLeft: LeftHandSnake
      Brain: OrganSnakeBrain
      Eyes: OrganSnakeEyes
      Lungs: OrganSnakeLungs
      Heart: OrganSnakeHeart
      Stomach: OrganSnakeStomach
      Liver: OrganSnakeLiver
      Kidneys: OrganSnakeKidneys
  - type: HumanoidProfile
    species: Zerah

- type: entity
  parent: OrganSnake
  id: OrganSnakeExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/Species/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Snake/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Zerah

- type: reagent
  id: ZerahPoison
  name: Яд зераха
  group: Toxins
  desc: Довольно опасный токсин, обладающий непредсказуемым эффектом.
  physicalDesc: токсичное
  color: "#fafa96"
  metabolisms:
    Narcotic:
      metabolismRate: 0.50
      effects:
      - !type:Emote
        emote: Scream
        showInChat: true
        probability: 0.1
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Zerah ]
          inverted: true
      - !type:Emote
        emote: Crying
        showInChat: true
        probability: 0.1
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Zerah ]
          inverted: true
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages:
        - "Вы испытываете резкую боль."
        - "Вам резко хочется плакать."
        - "Вас начинает охватывать паника."
        probability: 0.1
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Zerah ]
          inverted: true
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 5
        refresh: false
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Zerah ]
          inverted: true
      - !type:Vomit
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Zerah ]
          inverted: true
        - !type:ReagentCondition
          reagent: ZerahPoison
          min: 15
        probability: 0.3
      - !type:GenericStatusEffect
        key: TemporaryBlindness
        component: TemporaryBlindness
        time: 10
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Zerah ]
          inverted: true
        - !type:ReagentCondition
          reagent: ZerahPoison
          min: 25
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.90
        sprintSpeedModifier: 0.90
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Zerah ]
          inverted: true
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Zerah ]
          inverted: true
        - !type:ReagentCondition
          reagent: ZerahPoison
          min: 30
          max: 100
        damage:
          types:
            Poison: 0.5

- type: reagent
  id: ZerahBlood
  parent: Blood
  name: Кровь зераха
  group: Biological
  flavor: metallic
  color: "#e1b52e"

- type: entity
  id: PartSnake
  parent: [BaseItem, OrganBaseOrganic]
  name: "Часть тела зераха"
  abstract: true
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/Species/parts.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: ZerahBlood
        Quantity: 10

- type: entity
  id: TorsoSnake
  name: "Туловище зераха"
  parent: [PartSnake, OrganBaseTorso]
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/Species/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: ZerahBlood
        Quantity: 20

- type: entity
  id: HeadSnake
  name: "Голова зераха"
  parent: [PartSnake, OrganBaseHead]
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/Species/parts.rsi
    state: "head_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: ZerahBlood
        Quantity: 10

- type: entity
  id: LeftArmSnake
  name: "Левая рука зераха"
  parent: [PartSnake, OrganBaseArmLeft]
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/Species/parts.rsi
    state: "l_arm"

- type: entity
  id: RightArmSnake
  name: "Правая рука зераха"
  parent: [PartSnake, OrganBaseArmRight]
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/Species/parts.rsi
    state: "r_arm"

- type: entity
  id: LeftHandSnake
  name: "Левая рука зераха"
  parent: [PartSnake, OrganBaseHandLeft]
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/Species/parts.rsi
    state: "l_hand"

- type: entity
  id: RightHandSnake
  name: "Правая рука зераха"
  parent: [PartSnake, OrganBaseHandRight]
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/Species/parts.rsi
    state: "r_hand"
  - type: metabolizerType
  id: Zerah
  name: Зерах

- type: entity
  id: OrganZerahiBrain
  parent: OrganHumanBrain
  name: мозг зераха
  description: Источник невероятного, бесконечного интеллекта.
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/organs.rsi
    state: brain

- type: entity
  id: OrganZerahEyes
  parent: OrganHumanEyes
  name: глаза зераха
  description: Я тебя вижу
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/organs.rsi
    layers:
      - state: eyeball-l
      - state: eyeball-r

- type: entity
  id: OrganZerahHeart
  parent: BaseAnimalOrgan
  name: Сердце зераха
  description: Тук тук.
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/organs.rsi
    state: heart-off
  - type: Organ
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Zerah ]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic

- type: entity
  id: OrganZerahLungs
  parent: OrganHumanLungs
  name: лёгкие зераха
  description: Фильтрует азот из атмосферы, который затем поступает в кровоток.
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/organs.rsi
    layers:
      - state: lung-l
      - state: lung-r
  - type: Lung
    alert: LowNitrogen
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Slime ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: ZerahBlood
          Quantity: 10
      Lung:
        maxVol: 100.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  id: OrganZerahStomach
  name: желудок зераха
  parent: OrganAnimalStomach
  description: Отвратительно! Кто там сидит?!
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/organs.rsi
    state: stomach
  - type: Stomach
    specialDigestible:
      tags:
      - Meat
      - Pill
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Storage
    grid:
    - 0,0,6,3
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: Item
    size: Huge

- type: entity
  id: OrganZerahiLiver
  parent: OrganAnimalLiver
  name: печень зераха
  description: Побереги меня.
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/organs.rsi
    state: liver

- type: entity
  id: OrganZerahKidneys
  parent: OrganHumanKidneys
  name: почки зераха
  description: Выводит токсины из кровотока.
  components:
  - type: Sprite
    sprite: _Adventure/Races/Snake/organs.rsi
    layers:
      - state: kidney-l
      - state: kidney-r
  - type: soundCollection
  id: SnakeStep
  files:
  - /Audio/_Adventure/Voice/Snake/ZerahStep1.ogg
  - /Audio/_Adventure/Voice/Snake/ZerahStep2.ogg
  - /Audio/_Adventure/Voice/Snake/ZerahStep3.ogg
  - /Audio/_Adventure/Voice/Snake/ZerahStep4.ogg

- type: soundCollection
  id: SnakeScream
  files:
  - /Audio/_Adventure/Voice/Snake/ZerahScream1.ogg
  - /Audio/_Adventure/Voice/Snake/ZerahScream2.ogg
  - /Audio/_Adventure/Voice/Snake/ZerahScream3.ogg

- type: soundCollection
  id: SnakeLaugh
  files:
  - /Audio/_Adventure/Voice/Snake/ZerahHaha1.ogg
  - /Audio/_Adventure/Voice/Snake/ZerahHaha1.ogg

- type: soundCollection
  id: SnakeHissCollection
  files:
  - /Audio/_Adventure/Voice/Snake/ZerahSpeach1.ogg
  - /Audio/_Adventure/Voice/Snake/ZerahSpeach2.ogg
  - /Audio/_Adventure/Voice/Snake/ZerahSpeach3.ogg

- type: speechSounds
  id: SnakeSpeach
  saySound:
    path: /Audio/_Adventure/Voice/Snake/ZerahSpeach2.ogg
  askSound:
    path: /Audio/_Adventure/Voice/Snake/ZerahSpeach1.ogg
  exclaimSound:
    path: /Audio/_Adventure/Voice/Snake/ZerahSpeach3.ogg

- type: emoteSounds
  id: MaleZerah
  params:
    variation: 0.125
  sounds:
    Yawn:
      collection: MaleYawn
    Sneeze:
      collection: MaleSneezes
    Cough:
      collection: MaleCoughs
    Sigh:
      collection: MaleSigh
    Snore:
      collection: SnakeSpeach
    Scream:
      collection: SnakeScream
    Laugh:
      collection: SnakeLaugh
    Honk:
      collection: BikeHorn
    Whistle:
      collection: Whistles
    Hissing:
      collection: SnakeHissCollection
    Crying:
      collection: MaleCry
    Weh:
      collection: Weh
    Gasp:
      collection: MaleGasp
    DefaultDeathgasp:
      path: /Audio/_Adventure/Voice/Snake/ZerahDead.ogg
      params:
        volume: 4

- type: emoteSounds
  id: FemaleSnake
  params:
    variation: 0.125
  sounds:
    Yawn:
      collection: FemaleYawn
    Sneeze:
      collection: FemaleSneezes
    Cough:
      collection: FemaleCoughs
    Sigh:
      collection: FemaleSigh
    Snore:
      collection: SnakeSpeach
    Scream:
      collection: SnakeScream
    Laugh:
      collection: SnakeLaugh
    Honk:
      collection: BikeHorn
    Whistle:
      collection: Whistles
    Hissing:
      collection: SnakeHissCollection
    Crying:
      collection: FemaleCry
    Weh:
      collection: Weh
    Gasp:
      collection: FemaleGasp
    DefaultDeathgasp:
      path: /Audio/_Adventure/Voice/Snake/ZerahDead.ogg
- type: localizedDataset
  id: NamesZerah
  values:
    prefix: names-zerah-dataset-
    count: 30
