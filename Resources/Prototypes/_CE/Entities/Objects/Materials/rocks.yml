- type: entity
  id: CEDirtBlock1
  parent: BaseItem
  name: dirt block
  description: A block of excellent black soil.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Sprite
    noRot: true
    sprite: _CE/Objects/Materials/dirt.rsi
    layers:
      - state: dirt
        map: ["base"]
  - type: FloorTile
    placeTileSound:
      collection: CEDigging
      params:
        variation: 0.03
        volume: 2
    outputs:
      - CEDirt
      - CEDirtSeedbed
  - type: Appearance
  - type: Stack
    stackType: CEDirt
    count: 1
    baseLayer: base
    layerStates:
    - dirt
    - dirt_2
    - dirt_3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CEDirt: 10

- type: entity
  id: CEDirtBlock10
  parent: CEDirtBlock1
  suffix: 10
  components:
  - type: Stack
    count: 10

- type: entity
  id: CEStoneBlock1
  parent: BaseItem
  name: stone
  description: A cold stone.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Sprite
    noRot: true
    sprite: _CE/Objects/Materials/stone.rsi
    layers:
      - state: stone
        map: ["base"]
  - type: Appearance
  - type: Stack
    stackType: CEStone
    count: 1
    baseLayer: base
    layerStates:
    - stone
    - stone_2
    - stone_3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CEStone: 10
  - type: FloorTile
    placeTileSound:
      collection: CEDigging #TODO
      params:
        variation: 0.03
        volume: 2
    outputs:
      - CECobblestone
      - CEStone
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SharpStone:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
    angle: 1
    attackRate: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 3
  - type: ArmorPenetration
    penetration:
      Slash: 2
  - type: Projectile
    onlyCollideWhenShot: true
    damage:
      types:
        Blunt: 15
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.25
        density: 40
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Physics
    bodyType: Dynamic
  - type: CollisionWake
  - type: Tag
    tags:
      - Stone
  - type: Damageable
    damageModifierSet: Stone

- type: entity
  id: CEStoneBlock10
  parent: CEStoneBlock1
  suffix: 10
  components:
  - type: Stack
    count: 10


- type: entity
  id: CESnowBlock1
  parent: BaseItem
  name: snow block
  description: A block of compacted snow.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Sprite
    noRot: true
    sprite: _CE/Objects/Materials/snow.rsi
    layers:
      - state: snow
        map: ["base"]
  - type: Appearance
  - type: Stack
    stackType: CESnow
    count: 1
    baseLayer: base
    layerStates:
    - snow
    - snow_2
    - snow_3
  - type: FloorTile
    placeTileSound: /Audio/_CE/Effects/snowball.ogg
    outputs:
      - CESnow
      - CESnowDeep
      - CESnowDeepDeep

- type: entity
  id: CESnowBlock10
  parent: CESnowBlock1
  suffix: 10
  components:
  - type: Stack
    count: 10
